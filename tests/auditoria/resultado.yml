# O resultado da auditoria das 16 views (Bloco 1b do PLANO_base_dos_consumidores.md).
#
# É a declaração de que nasce o campo `view_audits` do pacote de metadados (docs/pacote_de_metadados.md):
# por view, o estado, o commit das views auditadas, os critérios, o teste de referência e os
# achados. O teste que sustenta cada linha é tests/test_auditoria_das_views.py, que compara a view
# com a referência e a população com a camada responsável.
#
# `commit` é o da definição auditada (UQ-21 do BI): o SQL da view, a referência e a população declarada
# estão nele como a auditoria os conferiu, e nenhum commit depois dele os mudou. Não é o commit em que a
# auditoria foi concluída pela primeira vez. O `commit` do topo vale para toda view que não declara o
# seu; a view cuja definição mudou depois declara o dela. Eram as 16 em 12677a3, e a revisão da auditoria
# mudou a P15 (F21) em 0471f6a. As rodadas 1 e 2 da revisão do Bloco 1b mudaram depois disso a população
# da P02, a referência da P03 (504271a) e a população da P15 (4da9e60). O F36 mudou o SQL e a referência
# da P12 (edf564a, ADR-0057). tests/test_auditoria_resultado.py confere a regra pelo histórico do Git. O
# commit que contém este arquivo não pode ser citado aqui, porque ainda não existe quando ele é escrito
# (a mesma regra do pacote): uma mudança de definição pede um commit depois dela que mude este arquivo.
#
# `findings` são os IDs dos Achados (docs/achados_nl_sql.md): os corrigidos antes ou durante a
# auditoria e as observações dela.

