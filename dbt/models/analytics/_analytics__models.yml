          sensitivity: public
      - name: campaign_id
        data_type: bigint
        description: "Campanha à qual o cupom pertence."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Código estável da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_objective
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Objetivo comercial da campanha."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: campaign_objective
          values:
            "acquisition": "Conquistar clientes novos."
            "clearance": "Liquidar estoque."
            "reactivation": "Trazer de volta clientes inativos."
            "retention": "Manter os clientes atuais comprando."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: campaign_objective
          - accepted_values:
              arguments:
                values: ["acquisition", "clearance", "reactivation", "retention"]
              config:
                meta:
                  value_domain: campaign_objective
      - name: discount_value
        data_type: numeric
        description: "Valor do desconto: percentual quando `percentage`, moeda quando `fixed`."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: min_order_amount
        data_type: numeric
        description: "Valor mínimo de pedido para o cupom ser elegível."
        meta:
          description_inherited: true
          sensitivity: public
      - name: coupon_is_active
        data_type: boolean
        description: "Indica se o cupom continua aceito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: valid_from
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Início da vigência da versão, lido como instante UTC do `dbt_valid_from` do snapshot. Na primeira, o início do período simulado (01/01/2024), e não o instante da primeira captura do snapshot."
        meta:
          sensitivity: internal
      - name: valid_to
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Fim da vigência da versão: o `dbt_valid_to` do snapshot, gravado em UTC sem fuso, lido como instante UTC (`at time zone 'UTC'`); nulo na versão vigente."
        meta:
          description_reason: a leitura explícita em UTC calcula sobre o `dbt_valid_to`, que é `timestamp` sem fuso — o texto da convenção diria o valor intacto (RVL3-3-03)
          sensitivity: internal
      - name: is_current
        data_type: boolean
        description: "Verdadeiro na versão vigente — a que não tem fim de vigência."
        meta:
          sensitivity: internal

  - name: dim_support_agent
    meta:
      domain: atendimento
    description: >
      **Grão: uma versão do agente** — `(source_system, support_agent_natural_key, valid_from)`, SCD
      tipo 2 pela **equipe**, que classifica o chamado. Carrega o membro desconhecido:
      `ticket_events.agent_id` é nulo quando o autor é o cliente.
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: support_agent_natural_key
    columns:
      - name: support_agent_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da **versão** do atendente: hash de `source_system`, `support_agent_id` e do início da vigência da versão (ADR-0017). O membro desconhecido tem chave própria."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: support_agent_natural_key
        data_type: bigint
        description: "Identificador do atendente na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: agent_team
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Equipe de atendimento à qual o agente pertence."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: support_agent_team
          not_observed:
            "Entregas": "O gerador sorteia a equipe entre as cinco (generator/geracao.yml, support_agents.team), e nenhum agente do dado de hoje caiu em Entregas."
          values:
            "Cadastro": "O próprio texto, a equipe de cadastro."
            "Desconhecido": "Membro desconhecido — Agente desconhecido — o evento cujo autor é o cliente, e o chamado que ainda não tem dono. Não é de origem nenhuma."
            "Devoluções": "O próprio texto, a equipe de devoluções."
            "Entregas": "O próprio texto, a equipe de entregas."
            "Pagamentos": "O próprio texto, a equipe de pagamentos."
            "Produtos": "O próprio texto, a equipe de produtos."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Cadastro", "Desconhecido", "Devoluções", "Entregas", "Pagamentos", "Produtos"]
              config:
                meta:
                  value_domain: support_agent_team
      - name: is_deleted
        data_type: boolean
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
            "unknown": "Membro desconhecido — Agente desconhecido — o evento cujo autor é o cliente, e o chamado que ainda não tem dono. Não é de origem nenhuma."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail", "unknown"]
              config:
                meta:
                  value_domain: source_system
      - name: agent_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Chave natural do agente."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: agent_first_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Primeiro nome do agente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: agent_last_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Sobrenome do agente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: agent_full_name
        data_type: text
        description: "Nome completo do atendente: o primeiro nome e o sobrenome, separados por espaço (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: agent_email
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "E-mail corporativo do agente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: hired_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Início do período de atuação do agente."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: handled_ticket_count
        data_type: bigint
        description: "**Não aditiva entre atendentes nem entre versões** — chamados distintos em que o atendente registrou algum evento, com o valor atual repetido em cada versão dele; um chamado atendido por dois conta para os dois."
        meta:
          sensitivity: internal
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: handled_event_count
        data_type: bigint
        description: "**Aditiva entre atendentes, só na versão vigente** (`is_current`) — eventos de chamado registrados pelo atendente, com o valor atual repetido em cada versão dele."
        meta:
          sensitivity: internal
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: agent_is_active
        data_type: boolean
        description: "Indica se o agente continua atuando."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: valid_from
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Início da vigência da versão, lido como instante UTC do `dbt_valid_from` do snapshot. Na primeira, o início do período simulado (01/01/2024), e não o instante da primeira captura do snapshot."
        meta:
          sensitivity: internal
      - name: valid_to
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Fim da vigência da versão: o `dbt_valid_to` do snapshot, gravado em UTC sem fuso, lido como instante UTC (`at time zone 'UTC'`); nulo na versão vigente."
        meta:
          description_reason: a leitura explícita em UTC calcula sobre o `dbt_valid_to`, que é `timestamp` sem fuso — o texto da convenção diria o valor intacto (RVL3-3-03)
          sensitivity: internal
      - name: is_current
        data_type: boolean
        description: "Verdadeiro na versão vigente — a que não tem fim de vigência. O membro desconhecido é sempre vigente."
        meta:
          sensitivity: internal

  - name: fact_coupon_redemption
    meta:
      domain: marketing
    description: >
      **Grão: um uso de cupom**, um por pedido. Duas âncoras temporais de
      propósito — o cupom pela versão do **resgate**, o cliente pela versão da
      **venda**, que é a mesma de `fact_sales_order_item`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, coupon_redemption_id]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, order_id]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('coupon_redemptions')
            medidas:
              coupon_discount_amount: coupon_discount_amount
    columns:
      - name: coupon_redemption_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta do resgate de cupom: hash de `source_system` e `coupon_redemption_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: coupon_redemption_id
        data_type: bigint
        description: "Identificador do resgate de cupom na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: order_id
        data_type: bigint
        meta:
          sensitivity: internal
          description_reason: "acrescenta ao significado herdado a restrição que o teste deste modelo cobra"
        description: >
          Um cupom por pedido — **por origem**. A unicidade está no teste de
          combinação do modelo: dois sistemas numeram pedidos a partir de 1, e
          exigi-la do id sozinho reprovaria dado correto.
        data_tests: [not_null]
      - name: date_key
        data_type: text
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: coupon_key
        data_type: text
        description: "Chave substituta da **versão** do cupom: hash de `source_system`, `coupon_id` e do início da vigência da versão (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_coupon'), field: coupon_key}
      - name: campaign_key
        data_type: text
        description: "Chave substituta da campanha: hash de `source_system` e `campaign_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_campaign'), field: campaign_key}
      - name: customer_key
        data_type: text
        description: "Chave substituta da **versão** do cliente (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: sales_channel_key
        data_type: text
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: geography_key
        data_type: text
        description: "Lugar da entrega do pedido em `dim_geography`; o membro desconhecido quando o endereço não casa com nenhum lugar."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: is_eligible
        data_type: boolean
        meta:
          sensitivity: confidential
        description: "Verdadeiro quando o resgate atende ao mesmo tempo à vigência do cupom, ao valor mínimo do pedido e ao limite de usos."
        data_tests: [not_null]
      - name: coupon_discount_amount
        data_type: numeric
        meta:
          sensitivity: confidential
          description_reason: "diz a aditividade da medida nesta fato, que o texto herdado não diz"
        description: '**Aditiva** — desconto efetivamente concedido.'
        data_tests: [not_null]
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: coupon_id
        data_type: bigint
        description: "Cupom utilizado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_number
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Número do pedido; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Código digitado pelo cliente."
        meta:
          description_inherited: true
          sensitivity: public
      - name: discount_type
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Natureza do desconto: percentage ou fixed."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: discount_type
          values:
            "fixed": "Desconto de valor fixo; o `discount_value` é em moeda."
            "percentage": "Desconto percentual; o `discount_value` é a porcentagem."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: discount_type
          - accepted_values:
              arguments:
                values: ["fixed", "percentage"]
              config:
                meta:
                  value_domain: discount_type
      - name: campaign_objective
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Objetivo comercial da campanha."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: campaign_objective
          values:
            "acquisition": "Conquistar clientes novos."
            "clearance": "Liquidar estoque."
            "reactivation": "Trazer de volta clientes inativos."
            "retention": "Manter os clientes atuais comprando."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: campaign_objective
          - accepted_values:
              arguments:
                values: ["acquisition", "clearance", "reactivation", "retention"]
              config:
                meta:
                  value_domain: campaign_objective
      - name: redemption_sequence
        data_type: bigint
        description: "Posição do resgate entre os do mesmo cupom, por ordem de data (1 é o primeiro); é ela que mede o limite de usos."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: redeemed_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio da utilização."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: placed_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio em que o pedido foi feito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_within_validity
        data_type: boolean
        description: "Verdadeiro quando o resgate aconteceu dentro da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_above_minimum
        data_type: boolean
        description: "Verdadeiro quando o subtotal do pedido alcança o valor mínimo do cupom, ou o cupom não tem mínimo."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: is_within_limit
        data_type: boolean
        description: "Verdadeiro quando o resgate cabe no limite de usos do cupom, pela ordem dos resgates, ou o cupom não tem limite."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_discount_bounded
        data_type: boolean
        description: "Verdadeiro quando o desconto do resgate não passa do subtotal do pedido."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: order_is_cancelled
        data_type: boolean
        description: "Verdadeiro quando o pedido está cancelado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_realised
        data_type: boolean
        description: "Verdadeiro quando o pedido é venda realizada: pago, em separação, enviado, entregue ou devolvido. O pendente e o cancelado não contam."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: redemption_count
        data_type: integer
        description: "Aditiva — 1 por resgate: soma-se para contar resgates."
        meta:
          sensitivity: internal
      - name: order_subtotal_amount
        data_type: numeric
        description: "Soma dos itens antes de desconto, frete e imposto."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: order_total_amount
        data_type: numeric
        description: "Valor total do pedido; reconcilia os demais campos."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: discount_share_of_order
        data_type: "{{ 'numeric(12,6)' if target.type != 'bigquery' else 'numeric' }}"
        description: "Não aditiva — fração do subtotal do pedido que o cupom descontou, de 0 a 1; nula em pedido sem subtotal."
        meta:
          sensitivity: confidential

  - name: fact_support_ticket_event
    meta:
      domain: atendimento
    description: >
      **Grão: um evento de um chamado.** Contar chamados aqui exige
      `count(distinct (source_system, support_ticket_id))` — o identificador se
      repete entre as origens; `event_count` é o que se soma.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, ticket_event_id]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('ticket_events')
            # só contagem: as horas até atribuição e resolução nascem na própria fato
    columns:
      - name: support_ticket_event_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta do evento de chamado: hash de `source_system` e `ticket_event_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: ticket_event_id
        data_type: bigint
        description: "Identificador do evento do chamado na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: date_key
        data_type: text
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: customer_key
        data_type: text
        description: "Chave substituta da **versão** do cliente (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: support_category_key
        data_type: text
        description: "Chave substituta da categoria de chamado: hash de `category_code` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_support_category'), field: support_category_key}
      - name: support_agent_key
        data_type: text
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: "Membro desconhecido quando o autor do evento é o cliente."
        data_tests:
          - not_null
          - relationships: {to: ref('dim_support_agent'), field: support_agent_key}
      - name: sales_channel_key
        data_type: text
        meta:
          sensitivity: internal
        description: Membro desconhecido quando o chamado não nasceu de um pedido.
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: geography_key
        data_type: text
        description: "Lugar do endereço de entrega do cliente em `dim_geography`; o membro desconhecido quando não há endereço que case."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: ticket_event_type
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Natureza do evento no chamado."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: ticket_event_type
          values:
            "assigned": "Atribuição do chamado a um agente."
            "created": "Abertura do chamado."
            "message": "Mensagem trocada no chamado."
            "reopened": "Reabertura de um chamado já resolvido."
            "resolved": "Resolução do chamado."
            "status_changed": "Mudança de estado do chamado sem ser resolução nem reabertura."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["assigned", "created", "message", "reopened", "resolved", "status_changed"]
              config:
                meta:
                  value_domain: ticket_event_type
      - name: event_count
        data_type: integer
        meta:
          sensitivity: internal
        description: '**Aditiva** — sempre 1, para que a contagem de eventos seja uma soma explícita.'
        data_tests: [not_null]
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: support_ticket_id
        data_type: bigint
        description: "Chamado ao qual o evento pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: ticket_number
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Número do chamado; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_id
        data_type: bigint
        description: "Pedido relacionado ao chamado, quando houver."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: ticket_category
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Motivo do chamado."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: support_ticket_category
          values:
            "account": "Conta — acesso, dados cadastrais e preferências."
            "delivery": "Entrega — atraso, extravio ou problema na entrega."
            "other": "Outros — contato que não se encaixa nas demais categorias."
            "payment": "Pagamento — falha, recusa ou cobrança indevida."
            "product": "Produto — defeito, divergência ou dúvida sobre o item."
            "return": "Devolução — pedido de devolução, troca ou arrependimento."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: support_ticket_category
          - accepted_values:
              arguments:
                values: ["account", "delivery", "other", "payment", "product", "return"]
              config:
                meta:
                  value_domain: support_ticket_category
      - name: ticket_priority
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Prioridade atribuída ao chamado."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: ticket_priority
          values:
            "high": "Prioridade alta."
            "low": "Prioridade baixa."
            "normal": "Prioridade normal."
            "urgent": "Prioridade urgente, a mais alta."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: ticket_priority
          - accepted_values:
              arguments:
                values: ["high", "low", "normal", "urgent"]
              config:
                meta:
                  value_domain: ticket_priority
      - name: ticket_status
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Estado atual do chamado."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: ticket_status
          values:
            "closed": "Chamado encerrado."
            "in_progress": "Chamado em atendimento."
            "open": "Chamado aberto, ainda não em atendimento."
            "resolved": "Chamado resolvido, ainda não fechado."
            "waiting_customer": "Chamado aguardando resposta do cliente."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: ticket_status
          - accepted_values:
              arguments:
                values: ["closed", "in_progress", "open", "resolved", "waiting_customer"]
              config:
                meta:
                  value_domain: ticket_status
      - name: event_sequence
        data_type: bigint
        description: "Posição do evento na história do chamado, por ordem de data (1 é a abertura)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: occurred_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio do evento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: opened_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de abertura do chamado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: closed_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de encerramento do chamado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_placed_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio em que o pedido foi feito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_ticket_creation
        data_type: boolean
        description: "Verdadeiro quando o evento abre o chamado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_assignment
        data_type: boolean
        description: "Verdadeiro quando o evento atribui o chamado a um atendente."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_message
        data_type: boolean
        description: "Verdadeiro quando o evento é uma mensagem."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_status_change
        data_type: boolean
        description: "Verdadeiro quando o evento muda o estado do chamado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_resolution
        data_type: boolean
        description: "Verdadeiro quando o evento resolve o chamado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_reopening
        data_type: boolean
        description: "Verdadeiro quando o evento reabre o chamado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_from_customer
        data_type: boolean
        description: "Verdadeiro quando o evento veio do cliente, sem atendente."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_closed
        data_type: boolean
        description: "Verdadeiro quando o chamado está resolvido ou fechado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: has_order
        data_type: boolean
        description: "Verdadeiro quando o chamado está ligado a um pedido."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: was_reopened
        data_type: boolean
        description: "Verdadeiro quando o chamado foi reaberto pelo menos uma vez."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_solved_first_time
        data_type: boolean
        description: "Verdadeiro quando o chamado foi resolvido e nunca reaberto."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: reopening_count
        data_type: bigint
        description: "**Não aditiva entre eventos** — vezes que o chamado foi reaberto, repetidas em cada evento dele: some uma vez por chamado, nunca por evento."
        meta:
          sensitivity: internal
          description_reason: a fato está no grão do evento e o valor é do chamado — o herdado diria aditiva por evento (RVL3-03)
      - name: hours_to_assignment
        data_type: "{{ 'numeric(12,4)' if target.type != 'bigquery' else 'numeric' }}"
        description: "Horas entre a abertura do chamado e a primeira atribuição a um atendente; nulo enquanto ele não foi atribuído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: hours_to_resolution
        data_type: "{{ 'numeric(12,4)' if target.type != 'bigquery' else 'numeric' }}"
        description: "Horas entre a abertura do chamado e a primeira resolução; nulo enquanto ele não foi resolvido."
        meta:
          description_inherited: true
          sensitivity: internal
