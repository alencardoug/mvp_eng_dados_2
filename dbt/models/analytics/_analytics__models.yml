          - not_null:
              config:
                meta:
                  value_domain: order_status
          - accepted_values:
              arguments:
                values: ["cancelled", "delivered", "paid", "pending", "picking", "returned", "shipped"]
              config:
                meta:
                  value_domain: order_status
      - name: placed_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio em que o pedido foi feito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: shipped_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento do despacho."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: estimated_delivery_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Prazo de entrega prometido ao cliente."
        meta:
          description_inherited: true
          sensitivity: public
      - name: delivered_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante da entrega, o do último evento de entrega da remessa; nulo enquanto ela não foi entregue."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: returned_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante da devolução, o do último evento de devolução; nulo sem devolução."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_dispatched
        data_type: boolean
        description: "Verdadeiro quando a remessa saiu do armazém."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_delivered
        data_type: boolean
        description: "Verdadeiro quando a remessa foi entregue."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_returned
        data_type: boolean
        description: "Verdadeiro quando a remessa voltou ao remetente."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_lost
        data_type: boolean
        description: "Verdadeiro quando a remessa está extraviada."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_shipment_count
        data_type: bigint
        description: "Não aditiva entre remessas — número de remessas do pedido, repetido em cada remessa dele."
        meta:
          sensitivity: internal
      - name: delivered_shipment_count
        data_type: bigint
        description: "Não aditiva entre remessas — remessas entregues do pedido, repetidas em cada remessa dele."
        meta:
          sensitivity: internal
      - name: is_order_cycle_closed
        data_type: boolean
        description: "Verdadeiro quando todas as remessas do pedido foram entregues e o ciclo de entrega está fechado (ADR-0033)."
        meta:
          sensitivity: internal
      - name: is_cycle_closing_shipment
        data_type: boolean
        description: "Verdadeiro na última remessa entregue do pedido. Ela fecha o ciclo de entrega só quando `is_order_cycle_closed` também é verdadeiro (ADR-0033); com o ciclo aberto, marca a mais recente das já entregues."
        meta:
          sensitivity: internal
      - name: is_split_order
        data_type: boolean
        description: "Verdadeiro quando o pedido foi dividido em mais de uma remessa."
        meta:
          sensitivity: internal
      - name: order_delivered_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante da entrega mais recente entre as remessas já entregues do pedido; nulo sem nenhuma entregue. É o fim do ciclo só quando `is_order_cycle_closed` é verdadeiro."
        meta:
          sensitivity: internal
      - name: failed_attempt_count
        data_type: bigint
        description: "Aditiva — tentativas de entrega da remessa que falharam."
        meta:
          description_inherited: true
          sensitivity: public
      - name: delivery_delay_days
        data_type: "{{ 'numeric(12,4)' if target.type != 'bigquery' else 'numeric' }}"
        description: "Dias entre a entrega e o prazo prometido: positivo é atraso, negativo é adiantamento; nulo sem entrega."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: transit_days
        data_type: "{{ 'numeric(12,4)' if target.type != 'bigquery' else 'numeric' }}"
        description: "Dias entre o despacho e a entrega; nulo enquanto falta um dos dois."
        meta:
          description_inherited: true
          sensitivity: internal

  - name: fact_order_status_event
    meta:
      domain: vendas
    description: >
      **Grão: uma transição de estado do pedido.** A máquina de estados vista
      como fato: `orders.order_status` diz onde o pedido está hoje, e esta fato
      diz por onde ele passou.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, order_status_event_id]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('order_status_events')
            medidas:
              hours_in_previous_status: hours_in_previous_status
    columns:
      - name: order_status_event_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da transição de estado do pedido: hash de `source_system` e `order_status_event_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: order_status_event_id
        data_type: bigint
        description: "Identificador da mudança de estado do pedido na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: date_key
        data_type: text
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: customer_key
        data_type: text
        description: "Chave substituta da **versão** do cliente (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: sales_channel_key
        data_type: text
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: geography_key
        data_type: text
        description: "Lugar da entrega do pedido em `dim_geography`; o membro desconhecido quando o endereço não casa com nenhum lugar."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: to_status
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Estado resultante da transição."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: order_status
          values:
            "cancelled": "Pedido cancelado antes do pagamento, depois de pago ou durante a separação. Não é pedido realizado. Estado terminal."
            "delivered": "Pedido entregue ao cliente. É pedido realizado."
            "paid": "Pagamento aprovado. É pedido realizado."
            "pending": "Pedido criado e ainda não pago. Não é pedido realizado."
            "picking": "Pedido em separação no armazém. É pedido realizado."
            "returned": "Pedido devolvido dentro do prazo de arrependimento, depois de entregue. Conta como pedido realizado; a devolução é outro fato."
            "shipped": "Pedido despachado do armazém. É pedido realizado."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["cancelled", "delivered", "paid", "pending", "picking", "returned", "shipped"]
              config:
                meta:
                  value_domain: order_status
      - name: from_status
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: order_status
          null_meaning: "O primeiro evento do pedido, a criação, não tem estado anterior."
          impossible:
            "cancelled": "Estado terminal: nenhuma transição sai dele (seed order_status_transitions; generator/geracao.yml, cobertura_dispensada de order_status_history)."
            "returned": "Estado terminal: nenhuma transição sai dele (seed order_status_transitions; generator/geracao.yml, cobertura_dispensada de order_status_history)."
          values:
            "delivered": "Pedido entregue ao cliente. É pedido realizado."
            "paid": "Pagamento aprovado. É pedido realizado."
            "pending": "Pedido criado e ainda não pago. Não é pedido realizado."
            "picking": "Pedido em separação no armazém. É pedido realizado."
            "shipped": "Pedido despachado do armazém. É pedido realizado."
        description: "Estado anterior; nulo na criação do pedido."
        data_tests:
          - accepted_values:
              arguments:
                values: ["delivered", "paid", "pending", "picking", "shipped"]
              config:
                meta:
                  value_domain: order_status
      - name: hours_in_previous_status
        data_type: "{{ 'numeric(12,4)' if target.type != 'bigquery' else 'numeric' }}"
        meta:
          description_reason: "diz como somar no grão da transição, que o texto herdado não diz"
          sensitivity: internal
        description: '**Não aditiva** — tempo no estado de origem; soma dentro do pedido, nunca entre pedidos.'
      - name: transition_count
        data_type: integer
        meta:
          sensitivity: internal
        description: '**Aditiva** — sempre 1, para que a contagem seja uma soma explícita.'
        data_tests: [not_null]
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: order_id
        data_type: bigint
        description: "Pedido cujo estado mudou."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_number
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Número do pedido; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: change_reason
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Motivo registrado para a transição."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: order_change_reason
          null_meaning: "A transição não tem motivo registrado; só a ida para `cancelled` e para `returned` o registra."
          values:
            "Cancelado a pedido do cliente": "O próprio texto. Registrado na transição para `cancelled`."
            "Devolução dentro do prazo de arrependimento": "O próprio texto. Registrado na transição para `returned`."
        data_tests:
          - accepted_values:
              arguments:
                values: ["Cancelado a pedido do cliente", "Devolução dentro do prazo de arrependimento"]
              config:
                meta:
                  value_domain: order_change_reason
      - name: status_sequence
        data_type: bigint
        description: "Posição da transição na história do pedido, por ordem de data (1 é a criação)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: placed_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio em que o pedido foi feito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: changed_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio da transição."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: previous_changed_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante da transição anterior do mesmo pedido; nulo na primeira."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: current_order_status
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Estado atual do pedido, repetido em cada transição dele; as transições são as linhas desta fato."
        meta:
          description_reason: "o texto herdado aponta para o que não está em analytics (F15)"
          sensitivity: internal
          value_domain: order_status
          values:
            "cancelled": "Pedido cancelado antes do pagamento, depois de pago ou durante a separação. Não é pedido realizado. Estado terminal."
            "delivered": "Pedido entregue ao cliente. É pedido realizado."
            "paid": "Pagamento aprovado. É pedido realizado."
            "pending": "Pedido criado e ainda não pago. Não é pedido realizado."
            "picking": "Pedido em separação no armazém. É pedido realizado."
            "returned": "Pedido devolvido dentro do prazo de arrependimento, depois de entregue. Conta como pedido realizado; a devolução é outro fato."
            "shipped": "Pedido despachado do armazém. É pedido realizado."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: order_status
          - accepted_values:
              arguments:
                values: ["cancelled", "delivered", "paid", "pending", "picking", "returned", "shipped"]
              config:
                meta:
                  value_domain: order_status
      - name: is_order_creation
        data_type: boolean
        description: "Verdadeiro na primeira transição do pedido, que não vem de estado nenhum."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_current_status
        data_type: boolean
        description: "Verdadeiro na transição mais recente do pedido — a do estado em que ele está."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_terminal_status
        data_type: boolean
        description: "Verdadeiro quando a transição leva o pedido a um estado final: `cancelled` ou `returned`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_cancellation
        data_type: boolean
        description: "Verdadeiro quando a transição leva o pedido a `cancelled`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_return
        data_type: boolean
        description: "Verdadeiro quando a transição leva o pedido a `returned`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_realised
        data_type: boolean
        description: "Verdadeiro quando o pedido é venda realizada: pago, em separação, enviado, entregue ou devolvido. O pendente e o cancelado não contam."
        meta:
          description_inherited: true
          sensitivity: internal

  # ── Etapa 9 — relacionamento e histórico ───────────────────────────────────
  - name: dim_campaign
    meta:
      domain: marketing
    description: >
      **Grão: uma campanha por origem** — `(source_system, campaign_natural_key)`, com o objetivo. SCD
      tipo 1 — o objetivo é fixado na criação e não muda. Para recortar as duas origens juntas, agrupe
      pelo nome (`campaign_name`): o mesmo membro tem uma chave em cada origem, e agrupar pela chave o
      parte em dois.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, campaign_natural_key]
    columns:
      - name: campaign_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da campanha: hash de `source_system` e `campaign_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: campaign_natural_key
        data_type: bigint
        description: "Identificador da campanha na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: campaign_objective
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Objetivo comercial da campanha."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: campaign_objective
          values:
            "acquisition": "Conquistar clientes novos."
            "clearance": "Liquidar estoque."
            "reactivation": "Trazer de volta clientes inativos."
            "retention": "Manter os clientes atuais comprando."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["acquisition", "clearance", "reactivation", "retention"]
              config:
                meta:
                  value_domain: campaign_objective
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: campaign_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Código estável da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_valid_from
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Início da vigência da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_valid_to
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Fim da vigência da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: budget_amount
        data_type: numeric
        description: "Orçamento previsto da campanha."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: campaign_is_active
        data_type: boolean
        description: "Indica se a campanha está ativa."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_running
        data_type: boolean
        description: "Verdadeiro quando a data de referência dos dados (`as_of_date`, 01/09/2026) cai dentro da vigência da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_finished
        data_type: boolean
        description: "Verdadeiro quando a vigência da campanha terminou antes de a data de referência dos dados (`as_of_date`, 01/09/2026)."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_deleted
        data_type: boolean
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal

  - name: dim_support_category
    meta:
      domain: atendimento
    description: >
      **Grão: uma categoria de chamado** (`support_category_natural_key`), sem origem: é **derivada**
      de uma *seed*, porque a origem só tem a lista dentro de um `CHECK` e uma dimensão precisa de
      nome legível e de agrupamento.
    columns:
      - name: support_category_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da categoria de chamado: hash de `category_code` (ADR-0017)."
        meta:
          sensitivity: public
        data_tests: [unique, not_null]
      - name: support_category_natural_key
        data_type: "{{ 'character varying(20)' if target.type != 'bigquery' else 'string' }}"
        description: "Código estável da categoria de chamado; chave natural."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: support_ticket_category
          values:
            "account": "Conta — acesso, dados cadastrais e preferências."
            "delivery": "Entrega — atraso, extravio ou problema na entrega."
            "other": "Outros — contato que não se encaixa nas demais categorias."
            "payment": "Pagamento — falha, recusa ou cobrança indevida."
            "product": "Produto — defeito, divergência ou dúvida sobre o item."
            "return": "Devolução — pedido de devolução, troca ou arrependimento."
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["account", "delivery", "other", "payment", "product", "return"]
              config:
                meta:
                  value_domain: support_ticket_category
      - name: support_category_name
        data_type: text
        description: "Nome da categoria de chamado."
        meta:
          description_inherited: true
          sensitivity: public
        data_tests: [not_null]
      - name: support_category_group
        data_type: text
        description: "Grupo que reúne categorias de chamado afins."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: support_category_group
          values:
            "Cadastro": "Reúne a categoria Conta (`account`)."
            "Catálogo": "Reúne a categoria Produto (`product`)."
            "Financeiro": "Reúne a categoria Pagamento (`payment`)."
            "Geral": "Reúne a categoria Outros (`other`)."
            "Logística": "Reúne a categoria Entrega (`delivery`)."
            "Pós-venda": "Reúne a categoria Devolução (`return`)."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: support_category_group
          - accepted_values:
              arguments:
                values: ["Cadastro", "Catálogo", "Financeiro", "Geral", "Logística", "Pós-venda"]
              config:
                meta:
                  value_domain: support_category_group
      - name: support_category_description
        data_type: text
        description: "O que a categoria de chamado cobre."
        meta:
          description_inherited: true
          sensitivity: public

  - name: dim_coupon
    meta:
      domain: marketing
    description: >
      **Grão: uma versão do cupom** — `(source_system, coupon_natural_key, valid_from)`, SCD tipo 2 no
      padrão misto: campanha e regra de desconto historizadas, uso acumulado corrente.
      `redemption_count` **não** entra nas `check_cols` do *snapshot* — cada resgate criaria uma
      versão, e a dimensão teria mais linhas que a fato que ela recorta.
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: coupon_natural_key
    columns:
      - name: coupon_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da **versão** do cupom: hash de `source_system`, `coupon_id` e do início da vigência da versão (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: coupon_natural_key
        data_type: bigint
        description: "Identificador do cupom na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: discount_type
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Natureza do desconto: percentage ou fixed."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: discount_type
          values:
            "fixed": "Desconto de valor fixo; o `discount_value` é em moeda."
            "percentage": "Desconto percentual; o `discount_value` é a porcentagem."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
