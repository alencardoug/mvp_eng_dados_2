          sensitivity: internal
      - name: is_cycle_closing_shipment
        data_type: boolean
        description: "Verdadeiro na última remessa entregue do pedido. Ela fecha o ciclo de entrega só quando `is_order_cycle_closed` também é verdadeiro (ADR-0033); com o ciclo aberto, marca a mais recente das já entregues."
        meta:
          sensitivity: internal
      - name: is_split_order
        data_type: boolean
        description: "Verdadeiro quando o pedido foi dividido em mais de uma remessa."
        meta:
          sensitivity: internal
      - name: order_delivered_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante da entrega mais recente entre as remessas já entregues do pedido; nulo sem nenhuma entregue. É o fim do ciclo só quando `is_order_cycle_closed` é verdadeiro."
        meta:
          sensitivity: internal
      - name: quantity_ordered
        data_type: integer
        description: "**Não aditiva entre itens de remessa** — quantidade comprada do SKU na linha do pedido, repetida em cada item de remessa da linha: some uma vez por linha do pedido, nunca por item de remessa."
