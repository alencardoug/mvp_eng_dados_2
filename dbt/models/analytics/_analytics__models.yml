  - name: fact_payment_transaction
    meta:
      domain: pagamentos
    description: >
      **Grão: uma tentativa ou operação financeira.** A operação recusada fica: é
      ela que mede quantas tentativas foram precisas para receber, e a taxa de
      aprovação conta as autorizações aprovadas sobre todas as tentativas.
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('payment_transactions')
            medidas:
              transaction_amount: transaction_amount
              captured_amount: captured_amount
    columns:
      - name: payment_transaction_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da transação de pagamento: hash de `source_system` e `payment_transaction_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: date_key
        data_type: text
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: payment_method_key
        data_type: text
        description: "Chave substituta do meio de pagamento: hash de `source_system` e `payment_method_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_payment_method'), field: payment_method_key}
      - name: customer_key
        data_type: text
        description: "Chave substituta da **versão** do cliente (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: transaction_type
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Operação financeira: authorization, capture, void ou refund."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: payment_transaction_type
          values:
            "authorization": "Pedido de reserva do valor ao meio de pagamento; é a tentativa de autorização."
            "capture": "Cobrança efetiva de valor autorizado; nunca excede o autorizado."
            "refund": "Devolução ao cliente de valor já capturado."
            "void": "Desfazimento de uma autorização que não foi capturada (pedido cancelado depois de pago)."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: payment_transaction_type
          - accepted_values:
              arguments:
                values: ["authorization", "capture", "refund", "void"]
              config:
                meta:
                  value_domain: payment_transaction_type
      - name: transaction_result
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Desfecho da operação: succeeded, failed ou pending."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: payment_transaction_result
          values:
            "failed": "A operação foi recusada."
            "pending": "A operação aguarda resposta; ainda não foi aceita nem recusada."
            "succeeded": "A operação foi aceita."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: payment_transaction_result
          - accepted_values:
              arguments:
                values: ["failed", "pending", "succeeded"]
              config:
                meta:
                  value_domain: payment_transaction_result
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: sales_channel_key
        data_type: text
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: payment_transaction_id
        data_type: bigint
        description: "Identificador da transação de pagamento na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: transaction_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Chave natural da transação."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: payment_id
        data_type: bigint
        description: "Pagamento ao qual a transação pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: payment_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Chave natural do pagamento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_id
        data_type: bigint
        description: "Pedido que o pagamento quita."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_number
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Número do pedido; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: gateway_response_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Código de retorno do adquirente simulado."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: gateway_response_code
          values:
            "00": "Sem significado de negócio neste dado; o gerador sorteia o código sem relação com o resultado."
            "05": "Sem significado de negócio neste dado; o gerador sorteia o código sem relação com o resultado."
            "51": "Sem significado de negócio neste dado; o gerador sorteia o código sem relação com o resultado."
            "57": "Sem significado de negócio neste dado; o gerador sorteia o código sem relação com o resultado."
            "91": "Sem significado de negócio neste dado; o gerador sorteia o código sem relação com o resultado."
            "GW-OK": "Sem significado de negócio neste dado; o gerador sorteia o código sem relação com o resultado."
            "GW-TIMEOUT": "Sem significado de negócio neste dado; o gerador sorteia o código sem relação com o resultado."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: gateway_response_code
          - accepted_values:
              arguments:
                values: ["00", "05", "51", "57", "91", "GW-OK", "GW-TIMEOUT"]
              config:
                meta:
                  value_domain: gateway_response_code
      - name: occurred_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio da operação."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: installments
        data_type: integer
        description: "Número de parcelas acordadas."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_instalment_plan
        data_type: boolean
        description: "Verdadeiro quando o pagamento é parcelado, em mais de uma parcela."
        meta:
          description_inherited: true
          sensitivity: public
      - name: attempt_count
        data_type: integer
        description: "Aditiva — 1 por transação: soma-se para contar tentativas."
        meta:
          sensitivity: internal
      - name: approved_count
        data_type: integer
        description: "Aditiva — 1 quando a transação foi aprovada, 0 nas demais."
        meta:
          sensitivity: internal
      - name: authorization_count
        data_type: integer
        description: "Aditiva — 1 quando a transação é uma autorização, 0 nas demais."
        meta:
          sensitivity: internal
      - name: approved_authorization_count
        data_type: integer
        description: "Aditiva — 1 quando a transação é uma autorização aprovada, 0 nas demais."
        meta:
          sensitivity: internal
      - name: transaction_amount
        data_type: numeric
        description: "Valor movimentado nesta operação."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: authorized_amount
        data_type: numeric
        description: "Aditiva — valor autorizado: o da transação quando ela é uma autorização bem-sucedida; zero nas demais."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: captured_amount
        data_type: numeric
        description: "Aditiva — valor capturado: o da transação quando ela é uma captura bem-sucedida; zero nas demais."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: refunded_amount
        data_type: numeric
        description: "Aditiva — valor estornado: o da transação quando ela é um estorno bem-sucedido; zero nas demais."
        meta:
          description_inherited: true
          sensitivity: confidential

