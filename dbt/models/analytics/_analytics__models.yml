        data_type: bigint
        description: "Pagamento ao qual a transação pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_id
        data_type: bigint
        description: "Pedido que o pagamento quita."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_number
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Número do pedido; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: refund_reason
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Motivo comercial do reembolso."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: refund_reason
          null_meaning: "A origem não informou o motivo."
          impossible:
            "Sem motivo registrado": "Rótulo que só a view da P10 escreve no lugar do nulo; a fato guarda o nulo."
          values:
            "Arrependimento em até 7 dias": "O próprio texto."
            "Cancelamento a pedido do cliente": "O próprio texto."
            "Divergência de item": "O próprio texto."
            "Entrega não realizada": "O próprio texto."
            "Produto com defeito": "O próprio texto."
        data_tests:
          - accepted_values:
              arguments:
                values: ["Arrependimento em até 7 dias", "Cancelamento a pedido do cliente", "Divergência de item", "Entrega não realizada", "Produto com defeito"]
              config:
                meta:
                  value_domain: refund_reason
      - name: refund_status
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Estado do reembolso: requested, completed ou rejected."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: refund_status
          values:
            "completed": "Reembolso concluído; o valor voltou ao cliente."
            "rejected": "Reembolso recusado; o valor não volta."
            "requested": "Reembolso pedido, ainda não decidido."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: refund_status
          - accepted_values:
              arguments:
                values: ["completed", "rejected", "requested"]
              config:
                meta:
                  value_domain: refund_status
      - name: refunded_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante registrado do reembolso, em qualquer estado: está preenchido também no solicitado e no recusado, e só marca a conclusão quando o estado é completed."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_completed
        data_type: boolean
        description: "Verdadeiro quando o reembolso foi concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_full_refund
        data_type: boolean
        description: "Verdadeiro quando o reembolso alcança o valor capturado do pagamento."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: refund_count
        data_type: integer
        description: "Aditiva — 1 por reembolso: soma-se para contar reembolsos."
        meta:
          sensitivity: internal
      - name: originally_captured_amount
        data_type: numeric
        description: "Valor capturado na transação de captura que este reembolso reverte; não é o capturado do período."
        meta:
          description_reason: "o texto herdado é o da transação genérica e não diz que é a captura revertida (F14)"
          sensitivity: confidential
      - name: completed_refund_amount
        data_type: numeric
        description: "Aditiva — valor do reembolso quando ele foi concluído; 0 nos demais."
        meta:
          sensitivity: confidential

  - name: fact_purchase_order_item
    meta:
      domain: compras
    description: '**Grão: um item de uma ordem de compra.**'
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('purchase_order_items')
            medidas:
              quantity_ordered: quantity_ordered
              received_cost_amount: received_cost_amount
    columns:
      - name: purchase_order_item_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da linha do pedido de compra: hash de `source_system` e `purchase_order_item_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: supplier_key
        data_type: text
        description: "Chave substituta do fornecedor: hash de `source_system` e `supplier_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_supplier'), field: supplier_key}
      - name: product_key
        data_type: text
        description: "Chave substituta da **versão** da variante do produto: hash de `source_system`, `product_variant_id` e do início da vigência da versão (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: quantity_ordered
        data_type: integer
        description: "Quantidade solicitada ao fornecedor."
        meta:
