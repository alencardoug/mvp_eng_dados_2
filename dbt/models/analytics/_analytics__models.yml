            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: date_key
        data_type: text
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: category_key
        data_type: text
        description: "Chave substituta da categoria: hash de `source_system` e `product_category_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - relationships: {to: ref('dim_category'), field: category_key}
      - name: purchase_order_item_id
        data_type: bigint
        description: "Identificador do item do pedido de compra na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: purchase_order_id
        data_type: bigint
        description: "Ordem de compra à qual o item pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: po_number
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Número da ordem de compra; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: purchase_order_status
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Estado da ordem de compra: draft, placed, partially_received, received ou cancelled."
        meta:
          description_reason: "o texto herdado aponta para o que não está em analytics (F15)"
          sensitivity: internal
          value_domain: purchase_order_status
          values:
            "cancelled": "Ordem cancelada."
            "draft": "Ordem em rascunho, ainda não enviada ao fornecedor."
            "partially_received": "Parte da quantidade pedida chegou em recebimento concluído."
            "placed": "Ordem enviada ao fornecedor, sem recebimento concluído."
            "received": "Toda a quantidade pedida chegou em recebimento concluído."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: purchase_order_status
          - accepted_values:
              arguments:
                values: ["cancelled", "draft", "partially_received", "placed", "received"]
              config:
                meta:
                  value_domain: purchase_order_status
      - name: ordered_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de emissão da ordem."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: expected_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Data prometida de entrega pelo fornecedor."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: first_received_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante do primeiro recebimento **concluído** da linha; nulo enquanto nenhum foi concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: last_received_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante do último recebimento **concluído** da linha; nulo enquanto nenhum foi concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_fully_received
        data_type: boolean
        description: "Verdadeiro quando a quantidade recebida em recebimentos concluídos alcança a pedida."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_not_received
        data_type: boolean
        description: "Verdadeiro quando nenhuma unidade da linha chegou em recebimento concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_cancelled
        data_type: boolean
        description: "Verdadeiro quando o pedido de compra está cancelado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: quantity_received
        data_type: bigint
        description: "Aditiva — unidades recebidas da linha, somando só os recebimentos **concluídos**; zero enquanto nenhum foi concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: quantity_outstanding
        data_type: bigint
        description: "Aditiva — unidades pedidas que ainda não chegaram em recebimento concluído."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: unit_cost
        data_type: numeric
        description: "Custo unitário negociado."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: ordered_cost_amount
        data_type: numeric
        description: "Custo total do item, já arredondado."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: received_cost_amount
        data_type: numeric
        description: "Aditiva — custo do que chegou: a quantidade recebida vezes o custo unitário de cada recebimento **concluído**, arredondado a centavos."
        meta:
          description_inherited: true
          sensitivity: confidential

  - name: fact_inventory_movement
    meta:
      domain: estoque
    description: >
      **Grão: um movimento de um SKU em um armazém.** Única fato `incremental`
      do projeto (ADR-0016), com as quatro proteções obrigatórias: `unique_key`,
      filtro por tempo de evento com margem, `--full-refresh` no plano da Etapa
      12, e o teste `incremental_confere_com_a_reconstrucao_completa`.
      A exceção tem **duas estratégias, uma por origem** (ADR-0042): `retail`
      chega por evento e entra por `merge` com a janela de atraso; `legacy` chega
      por captura e entra por `delete+insert`, com a partição reescrita inteira a
      cada execução. Para o ramo legado a idempotência vem do recorte por
      captura, não da `unique_key`, e a reconciliação por linha está em
      `legado_na_fato_segue_a_captura_corrente`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, idempotency_key]
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('inventory_movements')
            medidas:
              quantity_delta: quantity_delta
              cogs_amount: cogs_amount
    columns:
      - name: movement_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta do movimento de estoque: hash de `source_system` e `movement_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: movement_id
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: Chave do evento; é ela que torna o reprocessamento idempotente.
        data_tests: [unique, not_null]
      - name: idempotency_key
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Chave que impede aplicação duplicada pelo consumidor (ADR-0019)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: date_key
        data_type: text
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: product_key
        data_type: text
        description: "Chave substituta da **versão** da variante do produto: hash de `source_system`, `product_variant_id` e do início da vigência da versão (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: warehouse_key
        data_type: text
        description: "Chave substituta do armazém: hash de `source_system` e `warehouse_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_warehouse'), field: warehouse_key}
      - name: quantity_delta
        data_type: integer
        meta:
          sensitivity: internal
          description_reason: "diz a aditividade da medida nesta fato, que o texto herdado não diz; aditiva, porque é delta assinado (RVL3-10)"
        description: '**Aditiva** — variação assinada do saldo: positiva na entrada, negativa na saída; a soma num período é a variação líquida do estoque nele.'
        data_tests: [not_null]
      - name: cogs_amount
        data_type: numeric
        meta:
          description_reason: "a coluna implementa o conceito do glossário de negócio, e o texto é o dele"
          sensitivity: confidential
        description: '{{ doc("cost_of_goods_sold") }}'
        data_tests: [not_null]
      - name: movement_type
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Tipo controlado do movimento; determina o sinal da quantidade."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: inventory_movement_type
          values:
            "adjustment_in": "Entrada por ajuste de inventário (quantidade positiva), sempre com motivo documentado."
            "adjustment_out": "Saída por ajuste de inventário (quantidade negativa), sempre com motivo documentado."
            "customer_return": "Entrada por devolução de cliente (quantidade positiva)."
            "purchase_receipt": "Entrada por recebimento de compra (quantidade positiva)."
            "sale_dispatch": "Saída por venda expedida (quantidade negativa)."
            "supplier_return": "Saída por devolução ao fornecedor (quantidade negativa)."
            "transfer_in": "Entrada por transferência entre armazéns (quantidade positiva); sempre em par com um `transfer_out`, pelo mesmo `correlation_id`."
            "transfer_out": "Saída por transferência entre armazéns (quantidade negativa); sempre em par com um `transfer_in`, pelo mesmo `correlation_id`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: inventory_movement_type
          - accepted_values:
              arguments:
                values: ["adjustment_in", "adjustment_out", "customer_return", "purchase_receipt", "sale_dispatch", "supplier_return", "transfer_in", "transfer_out"]
              config:
                meta:
                  value_domain: inventory_movement_type
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: event_sequence
        data_type: bigint
        description: "Ordem do evento dentro da sua origem. No varejo, a sequência técnica que o banco atribui; no legado, a identidade física da linha na captura — desempate técnico, sem promessa de ordem de negócio (D40)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_type
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Processo de negócio que originou o movimento."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: inventory_source_type
          values:
            "adjustment": "Ajuste de inventário."
            "purchase": "Recebimento de compra."
            "return": "Devolução, de cliente ou ao fornecedor."
            "sale": "Expedição de venda."
            "transfer": "Transferência entre armazéns."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: inventory_source_type
          - accepted_values:
              arguments:
                values: ["adjustment", "purchase", "return", "sale", "transfer"]
              config:
                meta:
                  value_domain: inventory_source_type
      - name: source_id
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Identificador do registro que causou o movimento."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: correlation_id
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Agrupa eventos relacionados; obrigatório nos pares de transferência."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: aggregate_version
        data_type: bigint
        description: "Ordem do evento dentro do par armazém/SKU; sem lacuna nem repetição."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: occurred_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio do movimento; é por ele que o Beam janela (ADR-0019)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: recorded_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento em que a origem registrou o evento; base da leitura incremental."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: movement_date
        data_type: date
        description: "Data do movimento, no fuso de São Paulo."
        meta:
          sensitivity: internal
      - name: is_inbound
        data_type: boolean
        description: "Verdadeiro quando o movimento é de entrada: todo tipo que não é venda, devolução a fornecedor, transferência de saída ou ajuste de saída."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_outbound
        data_type: boolean
        description: "Verdadeiro quando o movimento é de saída: venda (`sale_dispatch`), devolução a fornecedor, transferência de saída ou ajuste de saída."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_sale
        data_type: boolean
        description: "Verdadeiro quando o movimento é a saída de uma venda (`sale_dispatch`)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: quantity_in
        data_type: integer
        description: "Aditiva — unidades que entraram no movimento; zero numa saída."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: quantity_out
        data_type: integer
        description: "Aditiva — unidades que saíram no movimento, em número positivo; zero numa entrada."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: unit_cost
        data_type: numeric
        description: "Custo unitário, quando aplicável ao tipo."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: movement_cost_amount
        data_type: numeric
        description: "Aditiva — custo do movimento: a quantidade movimentada, em valor absoluto, vezes o custo unitário (zero sem custo), arredondado a centavos."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: recording_delay_seconds
        data_type: integer
        description: "Segundos entre o instante de negócio do movimento e o seu registro na origem."
        meta:
          description_inherited: true
          sensitivity: internal

  # ── Etapa 8 — entrega e logística ──────────────────────────────────────────
  - name: dim_carrier
    meta:
      domain: logistica
    description: >
      **Grão: uma transportadora por origem** — `(source_system, carrier_natural_key)`, com a
      modalidade que ela presta. SCD tipo 1: a modalidade classifica o fato, mas não muda para uma
      transportadora contratada — o gatilho que a tornaria tipo 2 está escrito no próprio modelo. Para
      recortar as duas origens juntas, agrupe pelo nome (`carrier_name`): o mesmo membro tem uma chave
      em cada origem, e agrupar pela chave o parte em dois.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, carrier_natural_key]
    columns:
      - name: carrier_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da transportadora: hash de `source_system` e `carrier_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: carrier_natural_key
        data_type: bigint
        description: "Identificador da transportadora na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: service_level
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: carrier_service_level
          values:
            "express": "Entrega expressa (ordem 2)."
            "same_day": "Entrega no mesmo dia, a mais rápida (ordem 3)."
            "standard": "Entrega padrão, a mais lenta (ordem 1)."
        description: "Modalidade: standard, express ou same_day."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["express", "same_day", "standard"]
              config:
                meta:
                  value_domain: carrier_service_level
      - name: is_deleted
        data_type: boolean
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: carrier_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Código estável da transportadora."
        meta:
          description_inherited: true
          sensitivity: public
