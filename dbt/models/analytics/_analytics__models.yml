version: 2

# Testes do datamart. Três famílias, e cada uma existe por um motivo diferente:
#
#   grão          prova que a fato é o que ela diz ser. `unique` sobre a chave
#                 do grão é a única forma de a afirmação "uma linha por item de
#                 pedido" deixar de ser intenção (ADR-0018).
#   integridade   `not_null` + `relationships` em toda chave de dimensão. É a
#                 salvaguarda estrutural que o ADR-0029 exige: se alguém filtrar
#                 membros excluídos de uma dimensão, as linhas de fato
#                 correspondentes ficam sem par e o *build* quebra.
#   vigência      as SCD tipo 2 não podem ter vigências sobrepostas, senão o
#                 *join* temporal duplica linha de fato (invariante 11).
#   reconciliação toda fato declara a relação condutora de `trusted` de que
#                 nasce e as medidas que têm de somar igual dos dois lados
#                 (`fato_reconcilia_com_a_condutora`, Qualidade §7). É o que
#                 pega a junção interna que derruba linha em silêncio. Leva a
#                 etiqueta `fronteira`: compara camadas que a DAG constrói em
#                 tarefas diferentes, e só roda depois da última delas.

models:
  # ── Dimensões ──────────────────────────────────────────────────────────────
  - name: dim_date
    meta:
      domain: transversal
    description: >
      **Grão: um dia** (`full_date`). Calendário do período simulado. Dimensão estática, gerada da
      série de datas.
    columns:
      - name: date_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: full_date
        data_type: date
        description: "A data, uma linha por dia do calendário do período simulado."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: year_number
        data_type: integer
        description: "Ano da data."
        meta:
          sensitivity: internal
      - name: quarter_number
        data_type: integer
        description: "Trimestre do ano, de 1 a 4."
        meta:
          sensitivity: internal
      - name: month_number
        data_type: integer
        description: "Mês do ano, de 1 a 12."
        meta:
          sensitivity: internal
      - name: month_name
        data_type: text
        description: "Nome do mês por extenso, no idioma do banco."
        meta:
          sensitivity: internal
          value_domain: month_name
          values:
            "April": "Abril."
            "August": "Agosto."
            "December": "Dezembro."
            "February": "Fevereiro."
            "January": "Janeiro."
            "July": "Julho."
            "June": "Junho."
            "March": "Março."
            "May": "Maio."
            "November": "Novembro."
            "October": "Outubro."
            "September": "Setembro."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: month_name
          - accepted_values:
              arguments:
                values: ["April", "August", "December", "February", "January", "July", "June", "March", "May", "November", "October", "September"]
              config:
                meta:
                  value_domain: month_name
      - name: year_month
        data_type: text
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          sensitivity: internal
      - name: day_of_month
        data_type: integer
        description: "Dia do mês, de 1 a 31."
        meta:
          sensitivity: internal
      - name: day_of_week
        data_type: integer
        description: "Dia da semana ISO: 1 é segunda-feira, 7 é domingo."
        meta:
          sensitivity: internal
      - name: day_name
        data_type: text
        description: "Nome do dia da semana por extenso, no idioma do banco."
        meta:
          sensitivity: internal
          value_domain: day_of_week
          values:
            "Friday": "Sexta-feira."
            "Monday": "Segunda-feira."
            "Saturday": "Sábado."
            "Sunday": "Domingo."
            "Thursday": "Quinta-feira."
            "Tuesday": "Terça-feira."
            "Wednesday": "Quarta-feira."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: day_of_week
          - accepted_values:
              arguments:
                values: ["Friday", "Monday", "Saturday", "Sunday", "Thursday", "Tuesday", "Wednesday"]
              config:
                meta:
                  value_domain: day_of_week
      - name: iso_week_number
        data_type: integer
        description: "Número da semana ISO no ano."
        meta:
          sensitivity: internal
      - name: month_start_date
        data_type: date
        description: "Primeiro dia do mês da data."
        meta:
          sensitivity: internal
      - name: quarter_start_date
        data_type: date
        description: "Primeiro dia do trimestre da data."
        meta:
          sensitivity: internal
      - name: year_start_date
        data_type: date
        description: "Primeiro dia do ano da data."
        meta:
          sensitivity: internal
      - name: is_weekend
        data_type: boolean
        description: "Verdadeiro no sábado e no domingo."
        meta:
          sensitivity: internal

  - name: dim_customer
    meta:
      domain: clientes
    description: >
      **Grão: uma versão do cliente** — `(source_system, customer_natural_key, valid_from)`, SCD tipo
      2. O código do cliente (`customer_code`) se repete entre as origens para **pessoas diferentes**:
      identifique pela origem com a chave natural, nunca pelo código. {{ doc("active_customer") }}
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: customer_natural_key
    columns:
      - name: customer_key
        data_type: text
        constraints:
          - type: primary_key
        meta:
          sensitivity: internal
        description: Chave substituta da **versão** do cliente (ADR-0017).
        data_tests: [unique, not_null]
      - name: customer_natural_key
        data_type: bigint
        description: "Identificador do cliente na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: is_active
        data_type: boolean
        meta:
          description_reason: "a coluna implementa o conceito do glossário de negócio, e o texto é o dele"
          sensitivity: internal
        description: '{{ doc("active_customer") }}'
      - name: is_repeat_buyer
        data_type: boolean
        meta:
          description_reason: "a coluna implementa o conceito do glossário de negócio, e o texto é o dele"
          sensitivity: internal
        description: '{{ doc("repeat_purchase") }}'
      - name: is_deleted
        data_type: boolean
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: Exclusão lógica na origem; a linha permanece na dimensão (ADR-0029).
        data_tests: [not_null]
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: customer_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Chave natural do cliente na origem; estável entre cargas."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: first_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Primeiro nome do cliente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: last_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Sobrenome do cliente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: customer_full_name
        data_type: text
        description: "Nome completo do cliente: o primeiro nome e o sobrenome, separados por espaço (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: customer_document
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Documento de identificação do cliente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: birth_date
        data_type: date
        description: "Data de nascimento do cliente (sintética)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: registered_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio do cadastro, distinto de `created_at`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: first_order_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante do primeiro pedido realizado do cliente; nulo para quem nunca comprou. Conta o pedido cujos itens foram todos rejeitados e estão na quarentena, que não chega a `fact_sales_order_item`: a primeira compra pode não estar na fato."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: last_order_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante do último pedido realizado do cliente; nulo para quem nunca comprou."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_count
        data_type: bigint
        description: "**Aditiva entre clientes, só na versão vigente** (`is_current`) — pedidos realizados do cliente, com o valor atual repetido em cada versão dele; zero para quem nunca comprou. Conta também o pedido cujos itens foram todos rejeitados e estão na quarentena, que não chega a `fact_sales_order_item`."
        meta:
          sensitivity: internal
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: lifetime_net_revenue_amount
        data_type: numeric
        description: "**Aditiva entre clientes, só na versão vigente** (`is_current`) — receita líquida dos itens dos pedidos realizados do cliente, com o valor atual repetido em cada versão dele; zero para quem nunca comprou."
        meta:
          sensitivity: confidential
          description_reason: o valor atual de trusted, repetido em cada versão da dimensão — o herdado diria aditiva sem a vigência (RVL3-2-03)
      - name: is_churned
        data_type: boolean
        description: "Verdadeiro quando o cliente já comprou, mas o último pedido realizado é anterior a 180 dias da data de referência dos dados (`active_customer_window_days`)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: days_since_last_order
        data_type: "{{ 'numeric(12,2)' if target.type != 'bigquery' else 'numeric' }}"
        description: "Dias entre o último pedido realizado do cliente e a data de referência dos dados; nulo para quem nunca comprou."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_status
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Estado do relacionamento: active, inactive, blocked ou pending."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: customer_status
          values:
            "active": "Cliente com relacionamento ativo; pode comprar."
            "blocked": "Cliente impedido de comprar por decisão da empresa."
            "inactive": "Cliente sem relacionamento ativo, por iniciativa própria ou por falta de uso; o cadastro continua."
            "pending": "Cadastro iniciado e ainda não concluído ou confirmado."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: customer_status
          - accepted_values:
              arguments:
                values: ["active", "blocked", "inactive", "pending"]
              config:
                meta:
                  value_domain: customer_status
      - name: customer_segment_id
        data_type: bigint
        description: "Segmento comercial ao qual o cliente pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_segment_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Código estável do segmento, usado como chave natural."
        meta:
          description_inherited: true
          sensitivity: public
      - name: customer_segment_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome do segmento do cliente; 'Sem segmento' quando ele não tem um."
        meta:
          sensitivity: public
      - name: city
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Cidade; alimenta a dimensão de geografia."
        meta:
          description_inherited: true
          sensitivity: public
      - name: state_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Unidade federativa em sigla de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: country
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "País em código ISO de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: valid_from
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Início da vigência da versão, lido como instante UTC do `dbt_valid_from` do snapshot. Na primeira, o início do período simulado (01/01/2024), e não o instante da primeira captura do snapshot."
        meta:
          sensitivity: internal
      - name: valid_to
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Fim da vigência da versão: o `dbt_valid_to` do snapshot, gravado em UTC sem fuso, lido como instante UTC (`at time zone 'UTC'`); nulo na versão vigente."
        meta:
          description_reason: a leitura explícita em UTC calcula sobre o `dbt_valid_to`, que é `timestamp` sem fuso — o texto da convenção diria o valor intacto (RVL3-3-03)
          sensitivity: internal
      - name: is_current
        data_type: boolean
        description: "Verdadeiro na versão vigente — a que não tem fim de vigência."
        meta:
          sensitivity: internal

  - name: dim_product
    meta:
      domain: catalogo
    description: >
      **Grão: uma versão do SKU** — `(source_system, product_natural_key, valid_from)`, SCD tipo 2,
      com produto, categoria e marca. O código (`sku`) se repete entre as origens para **itens
      diferentes**: identifique pela origem com a chave natural, nunca pelo código.
    data_tests:
      - vigencias_sem_sobreposicao:
          chave_natural: product_natural_key
    columns:
      - name: product_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da **versão** da variante do produto: hash de `source_system`, `product_variant_id` e do início da vigência da versão (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: product_natural_key
        data_type: bigint
        description: "Identificador da variante do produto (o SKU) na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: is_deleted
        data_type: boolean
        description: "Verdadeiro quando a variante, o seu produto ou a sua categoria foi excluído logicamente na origem (ADR-0029)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: sku
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Código de estoque da variante; chave natural do SKU."
        meta:
          description_inherited: true
          sensitivity: public
      - name: product_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Chave natural do produto na origem."
        meta:
          description_inherited: true
          sensitivity: public
      - name: product_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome comercial do produto."
        meta:
          description_inherited: true
          sensitivity: public
      - name: variant_size
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Tamanho da variante."
        meta:
          description_inherited: true
          sensitivity: public
      - name: variant_color
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Cor da variante."
        meta:
          description_inherited: true
          sensitivity: public
      - name: variant_package
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Embalagem ou unidade de venda."
        meta:
          description_inherited: true
          sensitivity: public
      - name: barcode
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Código de barras da variante (sintético)."
        meta:
          description_inherited: true
          sensitivity: public
      - name: weight_grams
        data_type: integer
        description: "Peso em gramas, usado no cálculo de frete."
        meta:
          description_inherited: true
          sensitivity: public
      - name: product_id
        data_type: bigint
        description: "Identificador do produto na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: launched_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de lançamento comercial."
        meta:
          description_inherited: true
          sensitivity: public
      - name: product_status
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Estado do produto: draft, active ou discontinued."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: product_status
          values:
            "active": "Produto publicado e à venda."
            "discontinued": "Produto retirado de linha; não é mais vendido, mas o histórico continua."
            "draft": "Produto em preparação, ainda não publicado para venda."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: product_status
          - accepted_values:
              arguments:
                values: ["active", "discontinued", "draft"]
              config:
                meta:
                  value_domain: product_status
      - name: variant_is_active
        data_type: boolean
        description: "Indica se o SKU continua disponível para venda."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: product_category_id
        data_type: bigint
        description: "Identificador da categoria na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: leaf_category_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome comercial da categoria."
        meta:
          description_inherited: true
          sensitivity: public
      - name: sub_category_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome da categoria intermediária da variante, entre a raiz e a folha; nulo quando a categoria da variante é uma raiz."
        meta:
          description_inherited: true
          sensitivity: public
      - name: root_category_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome da categoria raiz da variante, no topo da árvore de categorias."
        meta:
          description_inherited: true
          sensitivity: public
      - name: brand_id
        data_type: bigint
        description: "Identificador da marca na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: brand_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome da marca do produto; 'Sem marca' quando ele não tem uma."
        meta:
          sensitivity: public
      - name: brand_country
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "País de origem, em código ISO."
        meta:
          description_inherited: true
          sensitivity: public
      - name: variant_is_deleted
        data_type: boolean
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: product_is_deleted
        data_type: boolean
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: valid_from
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Início da vigência da versão, lido como instante UTC do `dbt_valid_from` do snapshot. Na primeira, o início do período simulado (01/01/2024), e não o instante da primeira captura do snapshot."
        meta:
          sensitivity: internal
      - name: valid_to
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Fim da vigência da versão: o `dbt_valid_to` do snapshot, gravado em UTC sem fuso, lido como instante UTC (`at time zone 'UTC'`); nulo na versão vigente."
        meta:
          description_reason: a leitura explícita em UTC calcula sobre o `dbt_valid_to`, que é `timestamp` sem fuso — o texto da convenção diria o valor intacto (RVL3-3-03)
          sensitivity: internal
      - name: is_current
        data_type: boolean
        description: "Verdadeiro na versão vigente — a que não tem fim de vigência."
        meta:
          sensitivity: internal

  - name: dim_category
    meta:
      domain: catalogo
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_system, category_natural_key]
    description: >
      **Grão: uma categoria de produto por origem** — `(source_system, category_natural_key)`, com a
      categoria raiz ao lado. Para recortar as duas origens juntas, agrupe pelo nome
      (`category_name`): o mesmo membro tem uma chave em cada origem, e agrupar pela chave o parte em
      dois.
    columns:
      - name: category_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da categoria: hash de `source_system` e `product_category_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: category_natural_key
        data_type: bigint
        description: "Identificador da categoria na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [not_null]
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: category_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome comercial da categoria."
        meta:
          description_inherited: true
          sensitivity: public
      - name: sub_category_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome da categoria intermediária; na categoria que não tem intermediária, o da própria folha."
        meta:
          sensitivity: public
      - name: root_category_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome da categoria raiz da variante, no topo da árvore de categorias."
        meta:
          description_inherited: true
          sensitivity: public
      - name: category_depth
        data_type: integer
        description: "Profundidade na hierarquia, com a raiz em zero."
        meta:
          description_inherited: true
          sensitivity: public

  - name: dim_brand
    meta:
      domain: catalogo
    description: >
      **Grão: uma marca por origem** — `(source_system, brand_natural_key)`. Os nomes de marca não se
      repetem entre as origens no dado de hoje.
    columns:
      - name: brand_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta da marca: hash de `source_system` e `brand_id` (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: brand_natural_key
        data_type: bigint
        description: "Identificador da marca na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: brand_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome da marca."
        meta:
          description_inherited: true
          sensitivity: public
      - name: brand_country
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "País de origem, em código ISO."
        meta:
          description_inherited: true
          sensitivity: public

  - name: dim_sales_channel
    meta:
      domain: vendas
    description: >
      **Grão: um canal de venda por origem** — `(source_system, sales_channel_natural_key)`, mais o
      membro "Sem canal". Para recortar as duas origens juntas, agrupe pelo nome
      (`sales_channel_name`): o mesmo membro tem uma chave em cada origem, e agrupar pela chave o
      parte em dois. Carrega o membro "Sem canal" desde a Etapa 9: chamado que não nasce de pedido não
      tem canal, e a alternativa seria chave nula na fato — que some de todo recorte em vez de
      aparecer agrupada.
    columns:
      - name: sales_channel_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: channel_type
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Natureza do canal: web, app ou store."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: sales_channel_type
          values:
            "app": "Aplicativo."
            "store": "Loja física."
            "unknown": "Membro desconhecido — Canal desconhecido — o chamado que não nasceu de um pedido não tem canal. Não é de origem nenhuma."
            "web": "Loja online."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: sales_channel_type
          - accepted_values:
              arguments:
                values: ["app", "store", "unknown", "web"]
              config:
                meta:
                  value_domain: sales_channel_type
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
            "unknown": "Membro desconhecido — Canal desconhecido — o chamado que não nasceu de um pedido não tem canal. Não é de origem nenhuma."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail", "unknown"]
              config:
                meta:
                  value_domain: source_system
      - name: sales_channel_natural_key
        data_type: bigint
        description: "Identificador do canal de venda na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: sales_channel_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Código estável do canal."
        meta:
          description_inherited: true
          sensitivity: public
      - name: sales_channel_name
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_active
        data_type: boolean
        description: "Indica se o canal continua operando."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_deleted
        data_type: boolean
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal

  - name: dim_geography
    meta:
      domain: transversal
    description: >
      **Grão: um lugar** — `(country, state_code, city)`, conformado entre as origens, mais o membro
      "Desconhecido". Atende a venda e a remessa, e o membro desconhecido evita chave nula na fato.
    columns:
      - name: geography_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta do lugar: hash de país, unidade federativa e cidade; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          sensitivity: public
        data_tests: [unique, not_null]
      - name: region
        data_type: text
        description: "Região do IBGE a que a unidade federativa pertence."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: ibge_region
          values:
            "Centro-Oeste": "Região Centro-Oeste."
            "Desconhecido": "Membro desconhecido — Geografia desconhecida — o cliente sem endereço de entrega principal aterrissa aqui, em vez de sair do recorte por região."
            "Nordeste": "Região Nordeste."
            "Norte": "Região Norte."
            "Sudeste": "Região Sudeste."
            "Sul": "Região Sul."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Centro-Oeste", "Desconhecido", "Nordeste", "Norte", "Sudeste", "Sul"]
              config:
                meta:
                  value_domain: ibge_region
      - name: country
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "País em código ISO de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: state_code
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Unidade federativa em sigla de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: state_name
        data_type: text
        description: "Nome da unidade federativa por extenso."
        meta:
          description_inherited: true
          sensitivity: public
      - name: city
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Cidade; alimenta a dimensão de geografia."
        meta:
          description_inherited: true
          sensitivity: public

  # ── Fatos ──────────────────────────────────────────────────────────────────
  - name: fact_sales_order_item
    meta:
      domain: vendas
    description: >
      **Grão: uma linha de item de pedido.** Um SKU comprado em um pedido.
      Medidas todas aditivas; valores de nível de pedido não estão aqui, porque
      somá-los no grão de item multiplicaria o frete pelo número de itens.
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('order_items')
            medidas:
              quantity: quantity
              net_revenue_amount: net_revenue_amount
              line_total_amount: line_total_amount
    columns:
      - name: order_item_key
        data_type: text
        constraints:
          - type: primary_key
        meta:
          sensitivity: internal
        description: Chave do grão. O `unique` abaixo é o que prova o grão declarado.
        data_tests: [unique, not_null]
      - name: date_key
        data_type: text
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: customer_key
        data_type: text
        description: "Chave substituta da **versão** do cliente (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: product_key
        data_type: text
        description: "Chave substituta da **versão** da variante do produto: hash de `source_system`, `product_variant_id` e do início da vigência da versão (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_product'), field: product_key}
      - name: sales_channel_key
        data_type: text
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: category_key
        data_type: text
        description: "Chave substituta da categoria: hash de `source_system` e `product_category_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_category'), field: category_key}
      - name: geography_key
        data_type: text
        description: "Lugar da entrega do pedido em `dim_geography`; o membro desconhecido quando o endereço não casa com nenhum lugar."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - relationships: {to: ref('dim_geography'), field: geography_key}
      - name: net_revenue_amount
        data_type: numeric
        meta:
          description_reason: "a coluna implementa o conceito do glossário de negócio, e o texto é o dele"
          sensitivity: confidential
        description: '{{ doc("net_revenue") }}'
        data_tests: [not_null]
      - name: quantity
        data_type: integer
        description: "Quantidade comprada do SKU."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between: {min_value: 1}
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: brand_key
        data_type: text
        description: "Chave substituta da marca: hash de `source_system` e `brand_id` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - relationships: {to: ref('dim_brand'), field: brand_key}
      - name: order_id
        data_type: bigint
        description: "Pedido ao qual o item pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_item_id
        data_type: bigint
        description: "Identificador do item do pedido na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_number
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Número do pedido; chave natural."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: order_status
        data_type: "{{ 'character varying' if target.type != 'bigquery' else 'string' }}"
        description: "Estado atual do pedido; o histórico das mudanças está em `fact_order_status_event`."
        meta:
          description_reason: "o texto herdado aponta para o que não está em analytics (F15)"
          sensitivity: internal
          value_domain: order_status
          values:
            "cancelled": "Pedido cancelado antes do pagamento, depois de pago ou durante a separação. Não é pedido realizado. Estado terminal."
            "delivered": "Pedido entregue ao cliente. É pedido realizado."
            "paid": "Pagamento aprovado. É pedido realizado."
            "pending": "Pedido criado e ainda não pago. Não é pedido realizado."
            "picking": "Pedido em separação no armazém. É pedido realizado."
            "returned": "Pedido devolvido dentro do prazo de arrependimento, depois de entregue. Conta como pedido realizado; a devolução é outro fato."
            "shipped": "Pedido despachado do armazém. É pedido realizado."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: order_status
          - accepted_values:
              arguments:
                values: ["cancelled", "delivered", "paid", "pending", "picking", "returned", "shipped"]
              config:
                meta:
                  value_domain: order_status
      - name: order_date
        data_type: date
        description: "Data do pedido, no fuso de São Paulo."
        meta:
          sensitivity: internal
      - name: placed_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Momento de negócio em que o pedido foi feito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_realised
        data_type: boolean
        description: "Verdadeiro quando o pedido é venda realizada: pago, em separação, enviado, entregue ou devolvido. O pendente e o cancelado não contam."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_cancelled
        data_type: boolean
        description: "Verdadeiro quando o pedido está cancelado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_from_cart
        data_type: boolean
        description: "Verdadeiro quando o pedido nasceu de um carrinho; falso em venda direta."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: has_post_order_repeat
        data_type: boolean
        description: "Verdadeiro quando o cliente fez outro pedido realizado em até 90 dias depois deste (`repeat_purchase_window_days`); nulo enquanto a janela não fechou na data de referência dos dados (ADR-0036)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_repeat_window_closed
        data_type: boolean
        description: "Verdadeiro quando já se passaram 90 dias do pedido na data de referência dos dados: a janela da recompra pós-pedido está fechada."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: days_to_next_order
        data_type: "{{ 'numeric(12,4)' if target.type != 'bigquery' else 'numeric' }}"
        description: "Dias até o próximo pedido realizado do mesmo cliente; nulo quando não houve outro."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: unit_price
        data_type: numeric
        description: "Preço unitário praticado na venda."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: gross_revenue_amount
        data_type: numeric
        description: "Aditiva — receita bruta da linha: quantidade vezes preço unitário, antes do desconto, arredondada a centavos."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: discount_amount
        data_type: numeric
        description: "Desconto aplicado a este item."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: tax_amount
        data_type: numeric
        description: "Imposto simulado sobre este item."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: line_total_amount
        data_type: numeric
        description: "Valor total da linha, já arredondado."
        meta:
          description_inherited: true
          sensitivity: confidential

  - name: fact_cart_event
    meta:
      domain: vendas
    description: >
      **Grão: um evento de ciclo de vida de um carrinho** (ADR-0028). Até dois
      por carrinho, a abertura e o desfecho. As medidas são contadores que valem
      só na linha em que fazem sentido, de modo que toda soma esteja certa em
      qualquer recorte.
    data_tests:
      - fato_reconcilia_com_a_condutora:
          config:
            tags: [fronteira]
          arguments:
            condutora: ref('cart_lifecycle_events')
            # A fato zera o valor fora da linha de abertura (comentário do modelo);
            # a condutora recebe a mesma regra, senão o carrinho somaria em dobro.
            medidas:
              cart_value_amount: "case when event_type = 'created' then cart_value_amount else 0 end"
    columns:
      - name: cart_event_key
        data_type: text
        constraints:
          - type: primary_key
        description: "Chave substituta do evento do carrinho: hash de `source_system`, `cart_id` e `event_type` — um evento de cada tipo por carrinho (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: event_date_key
        data_type: text
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: cart_created_date_key
        data_type: text
        description: "Chave substituta da data: hash de `full_date` (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_date'), field: date_key}
      - name: sales_channel_key
        data_type: text
        description: "Chave substituta do canal de venda: hash de `source_system` e `sales_channel_id`; o membro desconhecido tem chave própria (ADR-0017)."
        meta:
          description_inherited: true
          sensitivity: internal
        data_tests:
          - not_null
          - relationships: {to: ref('dim_sales_channel'), field: sales_channel_key}
      - name: customer_key
        data_type: text
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: Nulo em sessão anônima — o carrinho existe, o cliente não foi identificado.
        data_tests:
          - relationships: {to: ref('dim_customer'), field: customer_key}
      - name: event_type
        data_type: text
        description: "Tipo do evento do ciclo de vida do carrinho: created (a criação), converted, abandoned ou expired. Não é o estado do carrinho, que usa open no lugar de created."
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: cart_event_type
          values:
            "abandoned": "O carrinho foi abandonado explicitamente, sem virar pedido; encerra o ciclo."
            "converted": "O carrinho virou pedido."
            "created": "Criação do carrinho."
            "expired": "O carrinho passou da validade sem virar pedido; encerra o ciclo."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["abandoned", "converted", "created", "expired"]
              config:
                meta:
                  value_domain: cart_event_type
      - name: source_system
        data_type: text
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
          value_domain: source_system
          values:
            "legacy": "A origem antiga, o banco legado, tratado e empilhado aos dados principais."
            "retail": "A origem transacional, o banco do marketplace. Airbyte e Beam transportam o mesmo `retail`."
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: source_system
          - accepted_values:
              arguments:
                values: ["legacy", "retail"]
              config:
                meta:
                  value_domain: source_system
      - name: cart_id
        data_type: bigint
        description: "Identificador do carrinho na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: occurred_at
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"
        description: "Instante do evento: a criação do carrinho, no evento de criação; a conversão, no de conversão; e, no carrinho que não converteu, o que vier primeiro entre a expiração e a data de referência dos dados."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: event_date
        data_type: date
        description: "Data do evento, no fuso de São Paulo."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: cart_created_date
        data_type: date
        description: "Data da criação do carrinho, no fuso de São Paulo."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_anonymous
        data_type: boolean
        description: "Verdadeiro quando o carrinho não tem cliente identificado — sessão anônima."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: cart_count
        data_type: integer
        description: "Aditiva — 1 no evento de criação do carrinho, 0 nos demais: soma-se para contar carrinhos."
        meta:
          sensitivity: internal
      - name: closed_cart_count
        data_type: integer
        description: "Aditiva — 1 no evento que fecha o carrinho (conversão, abandono ou expiração), 0 na criação."
        meta:
          sensitivity: internal
      - name: converted_cart_count
        data_type: integer
        description: "Aditiva — 1 quando o evento converte o carrinho em pedido, 0 nos demais."
        meta:
          sensitivity: internal
      - name: abandoned_cart_count
        data_type: integer
        description: "Aditiva — 1 quando o evento fecha o carrinho sem compra, por abandono ou expiração; 0 nos demais."
        meta:
          sensitivity: internal
      - name: cart_item_count
        data_type: bigint
        description: "Aditiva — itens do carrinho, no evento de criação; 0 nos demais."
        meta:
          sensitivity: internal
      - name: cart_unit_count
        data_type: bigint
        description: "Aditiva — unidades do carrinho, no evento de criação; 0 nos demais."
        meta:
          sensitivity: internal
      - name: cart_value_amount
        data_type: numeric
        description: "Aditiva — valor do carrinho, no evento de criação; 0 nos demais."
        meta:
          sensitivity: confidential
      - name: abandoned_value_amount
        data_type: numeric
        description: "Aditiva — valor do carrinho fechado sem compra, no evento de abandono ou expiração; 0 nos demais."
