  - name: stg_retail__inventory_movements
    description: >
      O livro de estoque, *append-only*, lido pelos dois caminhos (ADR-0031): os deltas do CDC em
      `raw.inventory_movements_stream` e a carga completa do Airbyte em `raw.inventory_movements`. Uma
      linha por movimento (`movement_id`): `raw` é *at least once*, e aqui a entrega é exatamente uma vez,
      com o conteúdo do caminho quente quando os dois trazem o movimento e as colunas que dizem por qual
      caminho ele chegou.
    meta:
      domain: estoque
    columns:
      - name: movement_id
        description: "Chave primária estável do evento."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: event_sequence
        description: "Ordenação técnica local e paginação; atribuída pelo banco."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: idempotency_key
        description: "Chave que impede aplicação duplicada pelo consumidor (ADR-0019)."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: warehouse_id
        description: "Armazém afetado pelo movimento."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: product_variant_id
        description: "SKU afetado pelo movimento."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: movement_type
        description: "Tipo controlado do movimento; determina o sinal da quantidade."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: quantity_delta
        description: "Variação assinada da quantidade; nunca zero."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: unit_cost
        description: "Custo unitário, quando aplicável ao tipo."
        meta:
          sensitivity: confidential
          description_inherited: true
      - name: source_type
        description: "Processo de negócio que originou o movimento."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: source_id
        description: "Identificador do registro que causou o movimento."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: correlation_id
        description: "Agrupa eventos relacionados; obrigatório nos pares de transferência."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: causation_id
        description: "Evento ou comando que causou este movimento."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: aggregate_version
        description: "Ordem do evento dentro do par armazém/SKU; sem lacuna nem repetição."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: occurred_at
        description: "Momento de negócio do movimento; é por ele que o Beam janela (ADR-0019)."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: recorded_at
        description: "Momento em que a origem registrou o evento; base da leitura incremental."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: schema_version
        description: "Versão do esquema do evento de movimento, como a origem a carimbou, em inteiro."
        meta:
          sensitivity: internal
      - name: event_metadata
        description: "Contexto adicional do evento, opcional e limitado a 4 KB."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: arrived_by_stream
        description: "Verdadeiro quando o movimento chegou pelo caminho quente (Debezium → Redpanda → Beam)."
        meta:
          sensitivity: internal
      - name: arrived_by_batch
        description: "Verdadeiro quando o movimento chegou pela carga em lote do Airbyte. Os dois podem ser verdadeiros: o movimento fica uma vez só."
        meta:
          sensitivity: internal
      - name: source_created_at
        description: "Momento em que a origem registrou o evento; base da leitura incremental."
        meta:
          sensitivity: internal
          description_inherited: true
      - name: is_deleted
        description: "{{ doc(\"is_deleted_append_only\") }}"
        meta:
          sensitivity: internal
          description_inherited: true
      - name: ingested_at
        description: "Instante da primeira chegada do movimento ao armazém, pelo caminho que chegou antes."
        meta:
          sensitivity: internal

