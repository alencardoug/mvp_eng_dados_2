version: 2

# As views de consumo têm **contrato aplicado** (ADR-0018): coluna, tipo e
# obrigatoriedade declarados aqui e verificados pela máquina a cada `build`.
#
# É atrito deliberado. Contrato que nada verifica é documentação — diverge do
# modelo real na primeira alteração e ninguém fica sabendo. Com `enforced`, o
# *build* quebra quando a forma muda, e a mudança quebrante precisa nascer como
# nova versão da view em vez de quebrar quem consome.
#
# Cada view responde **uma** pergunta do Glossário de Negócio e é nomeada por
# ela. Nas views de razão, numerador e denominador vão ao lado do resultado:
# taxa não se soma, e quem reagregar precisa dos dois.

models:
  - name: monthly_revenue_by_channel_and_category
    meta:
      domain: vendas
    description: 'P01 — Receita líquida por mês, canal e categoria. {{ doc("net_revenue") }}'
    config:
      contract: {enforced: true}
    columns:
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
        constraints: [{type: not_null}]
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: sales_channel_name
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: channel_type
        description: "Natureza do canal: web, app ou store."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: sales_channel_type
          values:
            "app": "Aplicativo."
            "store": "Loja física."
            "web": "Loja online."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: sales_channel_type
          - accepted_values:
              arguments:
                values: ["app", "store", "web"]
              config:
                meta:
                  value_domain: sales_channel_type
      - name: root_category_name
        description: "Nome da categoria raiz da variante, no topo da árvore de categorias."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: category_name
        description: "Nome comercial da categoria."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: order_count
        description: "Não aditiva entre categorias — pedidos realizados distintos, contados pela origem e pelo número; um pedido com itens de duas categorias conta nas duas."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: unit_count
        description: "Aditiva — unidades vendidas em pedidos realizados, por mês, canal e categoria."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: gross_revenue_amount
        description: "Aditiva — receita bruta, antes do desconto, dos itens de pedidos realizados, por mês, canal e categoria."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: discount_amount
        description: "Aditiva — desconto concedido nos itens de pedidos realizados, por mês, canal e categoria."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: net_revenue_amount
        description: "Aditiva — receita líquida dos itens de pedidos realizados, por mês, canal e categoria."
        meta:
          sensitivity: confidential
        data_type: numeric

  - name: average_order_value_by_channel_and_segment
    meta:
      domain: vendas
    description: 'P02 — Ticket médio por canal e segmento. {{ doc("average_order_value") }}'
    config:
      contract: {enforced: true}
    columns:
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
        constraints: [{type: not_null}]
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: sales_channel_name
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: customer_segment_name
        description: "Nome do segmento do cliente; 'Sem segmento' quando ele não tem um."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: order_count
        description: "Aditiva — pedidos realizados distintos, contados pela origem e pelo número, por mês, canal e segmento do cliente."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: net_revenue_amount
        description: "Aditiva — receita líquida dos itens de pedidos realizados, por mês, canal e segmento do cliente."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: average_order_value
        meta:
          sensitivity: confidential
        description: Não aditiva — razão entre as duas colunas anteriores.
        data_type: numeric

  - name: top_skus_by_revenue
    meta:
      domain: vendas
    description: P03 — Os 25 SKUs de maior receita e o peso de cada um na sua categoria.
    config:
      contract: {enforced: true}
    columns:
      - name: revenue_rank
        description: "Não aditiva — posição do SKU pela receita líquida no período, de 1 a 25; empates dividem a posição."
        meta:
          sensitivity: confidential
        data_type: bigint
        constraints: [{type: not_null}]
      - name: product_natural_key
        description: "Identificador da variante do produto (o SKU) na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: bigint
      - name: sku
        description: "Código de estoque da variante; chave natural do SKU."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: product_name
        description: "Nome comercial do produto."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: category_name
        description: "Nome comercial da categoria do SKU."
        meta:
          sensitivity: public
        data_type: text
      - name: root_category_name
        description: "Nome da categoria raiz da variante, no topo da árvore de categorias."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: brand_name
        description: "Nome da marca."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: is_deleted
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: SKU saiu do catálogo; a venda histórica dele continua contando (ADR-0029).
        data_type: boolean
      - name: unit_count
        description: "Aditiva — unidades do SKU vendidas em pedidos realizados, no período inteiro."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: net_revenue_amount
        description: "Aditiva — receita líquida do SKU em pedidos realizados, no período inteiro."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: category_net_revenue_amount
        description: "Não aditiva entre SKUs — receita líquida de toda a categoria do SKU no período, repetida em cada SKU dela."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: category_revenue_share_pct
        meta:
          sensitivity: confidential
        description: Não aditiva — só se soma dentro da mesma categoria.
        data_type: numeric

  - name: new_and_repeat_customers_by_month
    meta:
      domain: clientes
    description: 'P04 — Estreias por mês e recompra na janela, pelo grão do pedido (`fact_order_status_event`): todo pedido realizado conta, inclusive o de itens rejeitados em cascata. {{ doc("repeat_purchase") }}'
    config:
      contract: {enforced: true}
    columns:
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
        constraints: [{type: not_null}]
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: sales_channel_name
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: customer_segment_name
        description: "Nome do segmento do cliente; 'Sem segmento' quando ele não tem um."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: new_customer_count
        description: "Aditiva — clientes cuja primeira compra realizada caiu no mês, por canal e segmento."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: returning_customer_count
        description: "Aditiva — desses estreantes, os que fizeram a segunda compra realizada em até 90 dias da primeira."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: repeat_purchase_rate_pct
        meta:
          sensitivity: internal
        description: Não aditiva.
        data_type: numeric

  - name: revenue_by_delivery_region
    meta:
      domain: vendas
    description: P05 — Receita e pedidos por estado e região de entrega, por trimestre.
    config:
      contract: {enforced: true}
    columns:
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: quarter_number
        description: "Trimestre do ano, de 1 a 4."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: year_quarter
        description: "Ano e trimestre, no formato AAAA-Tn."
        meta:
          sensitivity: internal
        data_type: text
        constraints: [{type: not_null}]
      - name: region
        description: "Região do IBGE a que a unidade federativa pertence."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: ibge_region
          unknown_member: dim_geography.region
          values:
            "Centro-Oeste": "Região Centro-Oeste."
            "Desconhecido": "Membro desconhecido — Geografia desconhecida — o cliente sem endereço de entrega principal aterrissa aqui, em vez de sair do recorte por região."
            "Nordeste": "Região Nordeste."
            "Norte": "Região Norte."
            "Sudeste": "Região Sudeste."
            "Sul": "Região Sul."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: ibge_region
          - accepted_values:
              arguments:
                values: ["Centro-Oeste", "Desconhecido", "Nordeste", "Norte", "Sudeste", "Sul"]
              config:
                meta:
                  value_domain: ibge_region
      - name: state_code
        description: "Unidade federativa em sigla de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: state_name
        description: "Nome da unidade federativa por extenso."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: sales_channel_name
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: order_count
        description: "Aditiva — pedidos realizados distintos, contados pela origem e pelo número, por estado e região de entrega e trimestre."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: customer_version_count
        description: "Não aditiva — versões de cliente distintas no grupo: um cliente que mudou de versão conta mais de uma vez, e um que comprou em dois grupos conta nos dois."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: unit_count
        description: "Aditiva — unidades vendidas em pedidos realizados, por estado e região de entrega e trimestre."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: net_revenue_amount
        description: "Aditiva — receita líquida dos itens de pedidos realizados, por estado e região de entrega e trimestre."
        meta:
          sensitivity: confidential
        data_type: numeric

  - name: discount_share_by_channel
    meta:
      domain: vendas
    description: P06 — Desconto concedido como fração da receita bruta, por canal e mês.
    config:
      contract: {enforced: true}
    columns:
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
        constraints: [{type: not_null}]
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: sales_channel_name
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: channel_type
        description: "Natureza do canal: web, app ou store."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: sales_channel_type
          values:
            "app": "Aplicativo."
            "store": "Loja física."
            "web": "Loja online."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: sales_channel_type
          - accepted_values:
              arguments:
                values: ["app", "store", "web"]
              config:
                meta:
                  value_domain: sales_channel_type
      - name: root_category_name
        description: "Nome da categoria raiz da variante, no topo da árvore de categorias."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: order_count
        description: "Não aditiva entre categorias — pedidos realizados distintos, contados pela origem e pelo número; um pedido com itens de duas categorias raiz conta nas duas."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: gross_revenue_amount
        description: "Aditiva — receita bruta, antes do desconto, dos itens de pedidos realizados, por canal e mês."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: discount_amount
        description: "Aditiva — desconto concedido nos itens de pedidos realizados, por canal e mês."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: net_revenue_amount
        description: "Aditiva — receita líquida dos itens de pedidos realizados, por canal e mês."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: discount_share_pct
        meta:
          sensitivity: confidential
        description: Não aditiva.
        data_type: numeric

  - name: cart_conversion_rate_by_channel
    meta:
      domain: vendas
    description: 'P07 — Conversão de carrinho em pedido. {{ doc("cart_conversion_rate") }}'
    config:
      contract: {enforced: true}
    columns:
      - name: year_month
        meta:
          sensitivity: internal
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
        description: "Mês em que o **carrinho foi criado**, não em que converteu."
        data_type: text
        constraints: [{type: not_null}]
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: sales_channel_name
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: channel_type
        description: "Natureza do canal: web, app ou store."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: sales_channel_type
          values:
            "app": "Aplicativo."
            "store": "Loja física."
            "web": "Loja online."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: sales_channel_type
          - accepted_values:
              arguments:
                values: ["app", "store", "web"]
              config:
                meta:
                  value_domain: sales_channel_type
      - name: cart_count
        meta:
          sensitivity: internal
        description: "Aditiva — carrinhos abertos: topo do funil."
        data_type: bigint
      - name: closed_cart_count
        meta:
          sensitivity: internal
        description: "Aditiva — denominador da conversão. Carrinho ainda aberto não entra."
        data_type: bigint
      - name: converted_cart_count
        description: "Aditiva — carrinhos convertidos em pedido, por canal e mês."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: abandoned_cart_count
        meta:
          sensitivity: internal
        description: '{{ doc("abandoned_cart") }}'
        data_type: bigint
      - name: cart_conversion_rate_pct
        meta:
          sensitivity: internal
        description: Não aditiva.
        data_type: numeric
      - name: cart_value_amount
        description: "Aditiva — valor dos carrinhos criados, por canal e mês."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: abandoned_value_amount
        description: "Aditiva — valor dos carrinhos fechados sem compra, por abandono ou expiração, por canal e mês."
        meta:
          sensitivity: confidential
        data_type: numeric

  # ── Etapa 6: financeiro e estoque ─────────────────────────────────────────
  - name: gross_margin_by_category
    meta:
      domain: vendas
    description: >
      P08 — Lucro bruto e margem por categoria e mês. Receita e custo vêm de
      fatos diferentes, combinadas por *drill across* na granularidade comum
      (ADR-0030). Mês com custo e sem receita é o descasamento entre venda e
      expedição, e aparece de propósito.
    config:
      contract: {enforced: true}
    columns:
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM — o da receita, ou o do custo quando o grupo só tem custo."
        meta:
          sensitivity: internal
        data_type: text
      - name: year_number
        description: "Ano — o da receita, ou o do custo quando o grupo só tem custo."
        meta:
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12 — o da receita, ou o do custo quando o grupo só tem custo."
        meta:
          sensitivity: internal
        data_type: integer
      - name: root_category_name
        description: "Nome da categoria raiz — o da receita, ou o do custo quando o grupo só tem custo."
        meta:
          sensitivity: public
        data_type: text
      - name: category_name
        description: "Nome da categoria — o da receita, ou o do custo quando o grupo só tem custo."
        meta:
          sensitivity: public
        data_type: text
      - name: net_revenue_amount
        description: "Aditiva — receita líquida dos itens de pedidos realizados, por categoria e mês; zero quando o grupo só tem custo."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: cost_of_goods_sold
        description: "Aditiva — custo das mercadorias vendidas, das saídas de venda do livro de estoque, por categoria e mês; zero sem saída (ADR-0030)."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: gross_profit_amount
        description: "Aditiva — lucro bruto: a receita líquida menos o custo das mercadorias vendidas, por categoria e mês."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: gross_margin_pct
        description: "Não aditiva — margem bruta, em %: o lucro bruto sobre a receita líquida; nula sem receita. Recalcula-se a cada recorte."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: unit_count
        description: "Aditiva — unidades vendidas em pedidos realizados, por categoria e mês; zero quando o grupo só tem custo."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: dispatched_unit_count
        description: "Aditiva — unidades que saíram em venda no livro de estoque, por categoria e mês."
        meta:
          sensitivity: internal
        data_type: bigint
  - name: inventory_turnover_by_sku_and_warehouse
    meta:
      domain: estoque
    description: >
      P11 — Giro por SKU e armazém no trimestre (ADR-0052): o custo do que
      saiu em venda sobre o valor **médio** do estoque nos dias do trimestre,
      pela posição de fim de dia e o custo médio das entradas até o dia. Nada
      posterior ao trimestre muda o número. `avg_quantity_on_hand` é
      **semiaditiva**: soma por armazém e SKU, nunca ao longo do tempo. O
      estoque que entra e sai no mesmo dia não aparece na média.
    config:
      contract: {enforced: true}
    columns:
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: quarter_number
        description: "Trimestre do ano, de 1 a 4."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: year_quarter
        description: "Ano e trimestre, no formato AAAA-Tn."
        meta:
          sensitivity: internal
        data_type: text
      - name: sku
        description: "Código de estoque da variante; chave natural do SKU."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: product_name
        description: "Nome comercial do produto."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: category_name
        description: "Nome comercial da categoria."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: warehouse_name
        description: "Nome do armazém."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: warehouse_region
        description: "Região do IBGE a que a unidade federativa pertence."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: ibge_region
          not_observed:
            "Norte": "Os cinco armazéns declarados (generator/geracao.yml, warehouses) ficam em São Paulo, Extrema, Recife, Canoas e Goiânia; nenhum no Norte."
          values:
            "Centro-Oeste": "Região Centro-Oeste."
            "Nordeste": "Região Nordeste."
            "Norte": "Região Norte."
            "Sudeste": "Região Sudeste."
            "Sul": "Região Sul."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: ibge_region
          - accepted_values:
              arguments:
                values: ["Centro-Oeste", "Nordeste", "Norte", "Sudeste", "Sul"]
              config:
                meta:
                  value_domain: ibge_region
      - name: quantity_out
        description: "Aditiva — unidades do SKU que saíram em venda do armazém, no trimestre."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: cost_of_goods_sold
        description: "Aditiva — custo das saídas de venda do SKU no armazém, no trimestre (ADR-0030)."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: avg_quantity_on_hand
        description: "Semiaditiva — média, sobre os dias do trimestre, da posição de fim de dia do SKU no armazém, pelo livro de movimentos; zero sem posição. Soma-se entre armazéns, nunca entre trimestres."
        meta:
          sensitivity: internal
        data_type: numeric
      - name: avg_inventory_value_amount
        description: "Semiaditiva — média, sobre os dias do trimestre, do valor do estoque: a posição de fim de dia vezes o custo médio ponderado das entradas até aquele dia; nulo quando algum dia do trimestre tem posição sem nenhuma entrada com custo até ele. Soma-se entre SKUs e armazéns, nunca entre trimestres."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: inventory_turnover
        description: "Não aditiva — giro: o custo das mercadorias vendidas no trimestre sobre o valor médio do estoque nele; nulo sem valor médio positivo."
        meta:
          sensitivity: confidential
        data_type: numeric
  - name: payment_approval_rate_by_method
    meta:
      domain: pagamentos
    description: >
      P09 — Taxa de aprovação por meio e parcelamento. O denominador é a
      tentativa de autorização, não o pagamento: é o atrito que se quer ver.
    config:
      contract: {enforced: true}
    columns:
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: payment_method_name
        description: "Nome do meio de pagamento."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: method_type
        description: "Natureza do meio: cartão, pix, boleto, carteira ou vale."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: payment_method_type
          values:
            "boleto": "Boleto bancário."
            "credit_card": "Cartão de crédito."
            "debit_card": "Cartão de débito."
            "pix": "Pix."
            "voucher": "Vale-compra."
            "wallet": "Carteira digital."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: payment_method_type
          - accepted_values:
              arguments:
                values: ["boleto", "credit_card", "debit_card", "pix", "voucher", "wallet"]
              config:
                meta:
                  value_domain: payment_method_type
      - name: installments
        description: "Número de parcelas acordadas."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: integer
      - name: is_instalment_plan
        description: "Verdadeiro quando o pagamento é parcelado, em mais de uma parcela."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: boolean
      - name: authorization_attempt_count
        description: "Aditiva — autorizações tentadas, por mês, meio de pagamento e parcelas."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: approved_authorization_count
        description: "Aditiva — autorizações aprovadas, por mês, meio de pagamento e parcelas."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: approval_rate_pct
        description: "Não aditiva — autorizações aprovadas sobre as tentadas, em %; nula sem tentativa. Recalcula-se a cada recorte."
        meta:
          sensitivity: internal
        data_type: numeric
      - name: authorized_amount
        description: "Aditiva — valor autorizado nas autorizações bem-sucedidas, por mês, meio de pagamento e parcelas."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: captured_amount
        description: "Aditiva — valor capturado dos pagamentos, no grupo da primeira autorização aprovada de cada um, por mês, meio de pagamento e parcelas; zero sem captura."
        meta:
          sensitivity: confidential
        data_type: numeric
  - name: refund_rate_by_reason
    meta:
      domain: pagamentos
    description: >
      P10 — Reembolsado como fração do capturado, por motivo e mês.
    config:
      contract: {enforced: true}
    columns:
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: payment_method_name
        description: "Nome do meio de pagamento."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: refund_reason
        description: "Motivo do reembolso; 'Sem motivo registrado' quando a origem não o informa."
        meta:
          sensitivity: internal
          value_domain: refund_reason
          values:
            "Arrependimento em até 7 dias": "O próprio texto."
            "Cancelamento a pedido do cliente": "O próprio texto."
            "Divergência de item": "O próprio texto."
            "Entrega não realizada": "O próprio texto."
            "Produto com defeito": "O próprio texto."
            "Sem motivo registrado": "A origem não informou o motivo. Só a view da P10 o escreve, no lugar do nulo; a fato guarda o nulo."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: refund_reason
          - accepted_values:
              arguments:
                values: ["Arrependimento em até 7 dias", "Cancelamento a pedido do cliente", "Divergência de item", "Entrega não realizada", "Produto com defeito", "Sem motivo registrado"]
              config:
                meta:
                  value_domain: refund_reason
      - name: refund_count
        description: "Aditiva — reembolsos, por mês, meio de pagamento e motivo."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: refunded_amount
        description: "Aditiva — valor dos reembolsos concluídos, por mês, meio de pagamento e motivo."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: captured_amount
        description: "Não aditiva entre motivos — valor capturado no mês e no meio de pagamento, de todos os motivos, repetido em cada motivo; zero sem captura."
        meta:
          sensitivity: confidential
        data_type: numeric
      - name: refund_rate_pct
        description: "Não aditiva — valor reembolsado sobre o capturado no mês e no meio de pagamento, em %; nula sem captura. Recalcula-se a cada recorte."
        meta:
          sensitivity: confidential
        data_type: numeric

  # ── Etapa 7: estoque em tempo real ────────────────────────────────────────
  - name: skus_below_reorder_point
    meta:
      domain: estoque
    description: >
      P12 — SKUs abaixo do ponto de reposição agora, por armazém. É a única view
      do projeto que compõe o caminho frio com o quente (ADR-0031): o saldo é o
      da fato mais os deltas que ela ainda não absorveu, e por isso é a única
      cuja resposta muda entre duas execuções seguidas sem ninguém rodar nada.
    config:
      contract: {enforced: true}
    columns:
      - name: warehouse_name
        description: "Nome do armazém."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: warehouse_region
        description: "Região do IBGE a que a unidade federativa pertence."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: ibge_region
          not_observed:
            "Norte": "Os cinco armazéns declarados (generator/geracao.yml, warehouses) ficam em São Paulo, Extrema, Recife, Canoas e Goiânia; nenhum no Norte."
          values:
            "Centro-Oeste": "Região Centro-Oeste."
            "Nordeste": "Região Nordeste."
            "Norte": "Região Norte."
            "Sudeste": "Região Sudeste."
            "Sul": "Região Sul."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: ibge_region
          - accepted_values:
              arguments:
                values: ["Centro-Oeste", "Nordeste", "Norte", "Sudeste", "Sul"]
              config:
                meta:
                  value_domain: ibge_region
      - name: sku
        description: "Código de estoque da variante; chave natural do SKU."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: product_name
        description: "Nome comercial do produto."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: category_name
        description: "Nome comercial da categoria."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: brand_name
        description: "Nome da marca do produto; 'Sem marca' quando ele não tem uma."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: quantity_on_hand
        meta:
          sensitivity: internal
        description: >
          **Semiaditiva** — soma por armazém e SKU, nunca ao longo do tempo.
          Fotografia não se empilha.
        data_type: integer
      - name: quantity_reserved
        description: "Semiaditiva — unidades do SKU reservadas agora no armazém; zero sem reserva."
        meta:
          sensitivity: internal
        data_type: integer
      - name: quantity_available
        meta:
          sensitivity: internal
        description: '{{ doc("stock_availability") }}'
        data_type: integer
      - name: quantity_from_batch
        meta:
          sensitivity: internal
        description: "Semiaditiva — parcela do saldo já absorvida pela fato: o caminho frio."
        data_type: integer
      - name: quantity_from_stream
        meta:
          sensitivity: internal
        description: "Semiaditiva — parcela ainda só no caminho quente, que a próxima execução do dbt absorve."
        data_type: integer
      - name: stream_movement_count
        description: "Aditiva — movimentos do SKU no armazém que chegaram pelo caminho quente (ADR-0031)."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: reorder_point
        description: "Não aditiva — ponto de reposição, em unidades: 25 para todo SKU (variável `reorder_point_units`)."
        meta:
          sensitivity: internal
        data_type: integer
      - name: is_stockout
        meta:
          sensitivity: internal
        description: '{{ doc("stockout") }}'
        data_type: boolean
      - name: daily_demand_units
        meta:
          sensitivity: internal
        description: "Não aditiva — demanda diária média na janela de cobertura; só venda entra."
        data_type: numeric
      - name: days_of_cover
        meta:
          sensitivity: internal
        description: '{{ doc("days_of_cover") }}'
        data_type: numeric
      - name: last_movement_at
        description: "Não aditiva — instante do último movimento do SKU no armazém."
        meta:
          sensitivity: internal
        data_type: "{{ 'timestamp with time zone' if target.type != 'bigquery' else 'timestamp' }}"

  # ── Etapa 8 — entrega e logística ──────────────────────────────────────────
  # As duas medem entrega e **não se cruzam**: a primeira conta remessas, a
  # segunda conta pedidos (ADR-0033). O contrato de cada uma declara o grão no
  # nome das colunas, e a descrição diz qual população cada uma contém.
  - name: on_time_delivery_rate_by_carrier
    meta:
      domain: logistica
    description: >
      P13 — Fração de entregas dentro do prazo prometido, por transportadora e
      modalidade, mês a mês. **Grão da remessa**: pedido dividido conta duas
      vezes, de propósito. Conta toda remessa entregue, lida de
      `fact_shipment`, inclusive a que teve todos os itens rejeitados em
      cascata (ADR-0053, D66).
    config:
      contract: {enforced: true}
    columns:
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
        constraints: [{type: not_null}]
      - name: carrier_name
        description: "Nome da transportadora."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: service_level
        meta:
          sensitivity: public
          description_reason: "liga a coluna ao conceito do glossário de negócio que ela determina"
          value_domain: carrier_service_level
          values:
            "express": "Entrega expressa (ordem 2)."
            "same_day": "Entrega no mesmo dia, a mais rápida (ordem 3)."
            "standard": "Entrega padrão, a mais lenta (ordem 1)."
        description: '{{ doc("promised_lead_time") }}'
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: carrier_service_level
          - accepted_values:
              arguments:
                values: ["express", "same_day", "standard"]
              config:
                meta:
                  value_domain: carrier_service_level
      - name: warehouse_name
        description: "Nome do armazém."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: warehouse_region
        description: "Região do IBGE a que a unidade federativa pertence."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: ibge_region
          not_observed:
            "Norte": "Os cinco armazéns declarados (generator/geracao.yml, warehouses) ficam em São Paulo, Extrema, Recife, Canoas e Goiânia; nenhum no Norte."
          values:
            "Centro-Oeste": "Região Centro-Oeste."
            "Nordeste": "Região Nordeste."
            "Norte": "Região Norte."
            "Sudeste": "Região Sudeste."
            "Sul": "Região Sul."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: ibge_region
          - accepted_values:
              arguments:
                values: ["Centro-Oeste", "Nordeste", "Norte", "Sudeste", "Sul"]
              config:
                meta:
                  value_domain: ibge_region
      - name: delivered_count
        meta:
          sensitivity: internal
        description: "Aditiva — denominador: remessas **entregues**, não despachadas."
        data_type: bigint
      - name: on_time_count
        description: "Aditiva — remessas entregues até o prazo prometido, por mês, transportadora, modalidade e armazém."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: late_count
        description: "Aditiva — remessas entregues depois do prazo prometido, por mês, transportadora, modalidade e armazém."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: split_order_shipment_count
        description: "Aditiva — remessas entregues de pedidos divididos em mais de uma remessa."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: on_time_rate
        meta:
          sensitivity: internal
          description_reason: o conceito do glossário define a medida e a marca de que ela é feita, com o mesmo bloco
        description: '{{ doc("on_time_delivery") }}'
        data_type: numeric
      - name: avg_delay_days_when_late
        meta:
          sensitivity: internal
        description: '**Não aditiva** — média sobre as atrasadas; positivo é atraso.'
        data_type: numeric
      - name: avg_transit_days
        description: "Não aditiva — média de dias entre o despacho e a entrega das remessas do grupo; não se recompõe a partir de outras linhas."
        meta:
          sensitivity: internal
        data_type: numeric
      - name: failed_attempt_count
        description: "Aditiva — tentativas de entrega que falharam, nas remessas entregues do grupo."
        meta:
          sensitivity: public
        data_type: numeric

  - name: order_to_delivery_time_by_region
    meta:
      domain: logistica
    description: >
      P14 — Tempo médio entre pedido e entrega, por região e modalidade.
      **Grão do pedido**: fecha na última remessa a chegar, e pedido com remessa
      em aberto ou extraviada fica de fora. Lida de `fact_shipment`: conta
      também o pedido cujos itens foram todos rejeitados em cascata.
    config:
      contract: {enforced: true}
    columns:
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
        constraints: [{type: not_null}]
      - name: region
        description: "Região do IBGE a que a unidade federativa pertence."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: ibge_region
          unknown_member: dim_geography.region
          values:
            "Centro-Oeste": "Região Centro-Oeste."
            "Desconhecido": "Membro desconhecido — Geografia desconhecida — o cliente sem endereço de entrega principal aterrissa aqui, em vez de sair do recorte por região."
            "Nordeste": "Região Nordeste."
            "Norte": "Região Norte."
            "Sudeste": "Região Sudeste."
            "Sul": "Região Sul."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: ibge_region
          - accepted_values:
              arguments:
                values: ["Centro-Oeste", "Desconhecido", "Nordeste", "Norte", "Sudeste", "Sul"]
              config:
                meta:
                  value_domain: ibge_region
      - name: state_code
        description: "Unidade federativa em sigla de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: service_level
        meta:
          sensitivity: public
          description_reason: "diz o papel da coluna neste modelo, que o texto herdado não diz"
          value_domain: carrier_service_level
          values:
            "express": "Entrega expressa (ordem 2)."
            "same_day": "Entrega no mesmo dia, a mais rápida (ordem 3)."
            "standard": "Entrega padrão, a mais lenta (ordem 1)."
        description: Modalidade da remessa que **fechou** o ciclo.
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: carrier_service_level
          - accepted_values:
              arguments:
                values: ["express", "same_day", "standard"]
              config:
                meta:
                  value_domain: carrier_service_level
      - name: carrier_name
        description: "Nome da transportadora."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: order_count
        description: "Aditiva — pedidos com o ciclo de entrega fechado, por mês, região, unidade federativa, modalidade e transportadora."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: split_order_count
        description: "Aditiva — desses pedidos, os divididos em mais de uma remessa."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: shipment_count
        description: "Aditiva — remessas desses pedidos."
        meta:
          sensitivity: internal
        data_type: numeric
      - name: avg_order_to_delivery_days
        meta:
          sensitivity: internal
          description_reason: o conceito do glossário define a medida e a marca de que ela é feita, com o mesmo bloco
        description: '{{ doc("order_to_delivery_cycle") }}'
        data_type: numeric
      - name: median_order_to_delivery_days
        meta:
          sensitivity: internal
        description: "Não aditiva — a mediana ao lado da média separa operação lenta de operação irregular."
        data_type: numeric
      - name: max_order_to_delivery_days
        description: "Não aditiva — o maior ciclo de entrega do grupo, em dias, do pedido à entrega da última remessa."
        meta:
          sensitivity: internal
        data_type: numeric

  # ── Etapa 9 — relacionamento e atendimento ─────────────────────────────────
  - name: support_tickets_per_hundred_orders
    meta:
      domain: atendimento
    description: >
      P15 — Chamados por 100 pedidos, por categoria e canal, mês a mês. O mês é
      o da **abertura** do chamado. O canal e a categoria vão pelo **nome**,
      somando as origens: `channel_order_count` são os pedidos realizados do
      mês e do canal em todas as origens, tenham elas chamado ou não, lidos do grão do pedido
      (`fact_order_status_event`), inclusive o pedido de itens rejeitados em
      cascata. Ele se
      repete em cada categoria — o nome diz o grão, e somá-lo entre categorias
      multiplica os pedidos. Há linha só onde houve chamado, e a taxa é nula no
      canal "Sem canal", que não tem pedidos para servir de denominador.
    config:
      contract: {enforced: true}
    columns:
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
        constraints: [{type: not_null}]
      - name: sales_channel_name
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: channel_type
        description: "Natureza do canal: web, app ou store."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: sales_channel_type
          unknown_member: dim_sales_channel.channel_type
          values:
            "app": "Aplicativo."
            "store": "Loja física."
            "unknown": "Membro desconhecido — Canal desconhecido — o chamado que não nasceu de um pedido não tem canal. Não é de origem nenhuma."
            "web": "Loja online."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: sales_channel_type
          - accepted_values:
              arguments:
                values: ["app", "store", "unknown", "web"]
              config:
                meta:
                  value_domain: sales_channel_type
      - name: support_category_name
        description: "Nome da categoria de chamado."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: support_category_group
        description: "Grupo que reúne categorias de chamado afins."
        meta:
          description_inherited: true
          sensitivity: public
          value_domain: support_category_group
          values:
            "Cadastro": "Reúne a categoria Conta (`account`)."
            "Catálogo": "Reúne a categoria Produto (`product`)."
            "Financeiro": "Reúne a categoria Pagamento (`payment`)."
            "Geral": "Reúne a categoria Outros (`other`)."
            "Logística": "Reúne a categoria Entrega (`delivery`)."
            "Pós-venda": "Reúne a categoria Devolução (`return`)."
        data_type: text
        data_tests:
          - not_null:
              config:
                meta:
                  value_domain: support_category_group
          - accepted_values:
              arguments:
                values: ["Cadastro", "Catálogo", "Financeiro", "Geral", "Logística", "Pós-venda"]
              config:
                meta:
                  value_domain: support_category_group
      - name: ticket_count
        description: "Aditiva — chamados abertos, por mês, canal e categoria de chamado."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: high_priority_ticket_count
        description: "Aditiva — chamados de prioridade alta ou urgente."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: reopened_ticket_count
        description: "Aditiva — chamados reabertos pelo menos uma vez."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: solved_first_time_count
        description: "Aditiva — chamados resolvidos sem reabertura."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: channel_order_count
        meta:
          sensitivity: internal
        description: "Não aditiva — denominador do **canal**, repetido em cada linha de categoria."
        data_type: numeric
      - name: tickets_per_hundred_orders
        description: "Não aditiva — chamados por 100 pedidos realizados do canal no mês. Recalcula-se a cada recorte."
        meta:
          sensitivity: internal
        data_type: numeric
      - name: avg_hours_to_resolution
        meta:
          sensitivity: internal
        description: '**Não aditiva** — média por chamado aberto no mês.'
        data_type: numeric

  - name: repeat_purchase_rate_after_support
    meta:
      domain: atendimento
    description: >
      P16 — Recompra em 90 dias depois do pedido, comparando pedidos que geraram
      chamado com os que não geraram. {{ doc("post_order_repeat_purchase") }}
    config:
      contract: {enforced: true}
    columns:
      - name: year_number
        description: "Ano da data."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: month_number
        description: "Mês do ano, de 1 a 12."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: integer
      - name: year_month
        description: "Ano e mês, no formato AAAA-MM."
        meta:
          description_inherited: true
          sensitivity: internal
        data_type: text
        constraints: [{type: not_null}]
      - name: sales_channel_name
        description: "Nome do canal de venda."
        meta:
          description_inherited: true
          sensitivity: public
        data_type: text
      - name: has_support_ticket
        meta:
          sensitivity: internal
        description: A linha `false` é o grupo de comparação, uma por mês e canal.
        data_type: boolean
      - name: support_category_name
        meta:
          sensitivity: public
        description: '"Sem chamado" no grupo de comparação.'
        data_type: text
      - name: order_count
        meta:
          sensitivity: internal
        description: >
          Não aditiva entre categorias — pedidos com janela fechada. Um pedido
          que gerou chamados de duas categorias aparece nas duas linhas: somar
          entre categorias o conta duas vezes.
        data_type: bigint
      - name: repeat_order_count
        description: "**Não aditiva entre categorias** — pedidos com janela fechada que tiveram recompra em até 90 dias, por mês, canal, ter ou não chamado e categoria do chamado. Um pedido com chamados de duas categorias conta nas duas linhas: somar entre categorias o conta duas vezes."
        meta:
          sensitivity: internal
        data_type: bigint
      - name: repeat_purchase_rate
        meta:
          sensitivity: internal
        description: '{{ doc("post_order_repeat_purchase") }}'
        data_type: numeric
      - name: avg_days_to_next_order
        meta:
          sensitivity: internal
        description: '**Não aditiva** — média entre os que voltaram.'
        data_type: numeric

unit_tests:
  - name: chamados_por_cem_pedidos_somam_as_origens_do_canal
    description: >
      F1 dos Achados do nl_sql. O denominador é do mês e do canal pelo nome,
      somando as origens, e não depende de quais origens tiveram chamado: o
      Aplicativo tem 22 pedidos realizados no retail e 1 no legacy, e o chamado
      de Conta, só do retail, dá 100/23 = 4,3478 (a view antiga dava 100/22). Na
      Entrega, os chamados das duas origens viram uma linha só, e a média de
      horas é a dos chamados (30), não a média das médias por origem (37,5). O
      "Sem canal" não tem pedido e fica com a taxa nula.
    model: support_tickets_per_hundred_orders
    given:
      - input: ref('fact_order_status_event')
        format: csv
        rows: |
          date_key,sales_channel_key,source_system,order_id,is_realised,is_order_creation
          d1,ch_app_r,retail,1,true,true
          d1,ch_app_r,retail,2,true,true
          d1,ch_app_r,retail,3,true,true
          d1,ch_app_r,retail,4,true,true
          d1,ch_app_r,retail,5,true,true
          d1,ch_app_r,retail,6,true,true
          d1,ch_app_r,retail,7,true,true
          d1,ch_app_r,retail,8,true,true
          d1,ch_app_r,retail,9,true,true
          d1,ch_app_r,retail,10,true,true
          d1,ch_app_r,retail,11,true,true
          d1,ch_app_r,retail,12,true,true
          d1,ch_app_r,retail,13,true,true
          d1,ch_app_r,retail,14,true,true
          d1,ch_app_r,retail,15,true,true
          d1,ch_app_r,retail,16,true,true
          d1,ch_app_r,retail,17,true,true
          d1,ch_app_r,retail,18,true,true
          d1,ch_app_r,retail,19,true,true
          d1,ch_app_r,retail,20,true,true
          d1,ch_app_r,retail,21,true,true
          d1,ch_app_r,retail,22,true,true
          d1,ch_app_r,retail,1,true,false
          d1,ch_app_r,retail,99,false,true
          d1,ch_app_l,legacy,1,true,true
      - input: ref('fact_support_ticket_event')
        format: csv
        rows: |
          date_key,sales_channel_key,support_category_key,support_ticket_id,ticket_priority,was_reopened,is_solved_first_time,hours_to_resolution,is_ticket_creation
          d1,ch_app_r,cat_conta,1,low,false,true,4,true
          d1,ch_app_r,cat_entrega,2,high,false,true,10,true
          d1,ch_app_r,cat_entrega,3,urgent,true,false,20,true
          d1,ch_app_r,cat_entrega,3,urgent,true,false,20,false
          d1,ch_app_l,cat_entrega,4,low,false,true,60,true
          d1,ch_sem,cat_conta,5,low,false,true,8,true
      - input: ref('dim_date')
        rows:
          - {date_key: d1, year_number: 2024, month_number: 1, year_month: "2024-01"}
      - input: ref('dim_sales_channel')
        rows:
          - {sales_channel_key: ch_app_r, sales_channel_name: Aplicativo, channel_type: app}
          - {sales_channel_key: ch_app_l, sales_channel_name: Aplicativo, channel_type: app}
          - {sales_channel_key: ch_sem, sales_channel_name: Sem canal, channel_type: unknown}
      - input: ref('dim_support_category')
        rows:
          - {support_category_key: cat_conta, support_category_name: Conta, support_category_group: Cadastro}
          - {support_category_key: cat_entrega, support_category_name: Entrega, support_category_group: Logística}
    expect:
      rows:
        - {year_month: "2024-01", sales_channel_name: Aplicativo, support_category_name: Conta, ticket_count: 1, channel_order_count: 23, tickets_per_hundred_orders: 4.3478, avg_hours_to_resolution: "4.00"}
        - {year_month: "2024-01", sales_channel_name: Aplicativo, support_category_name: Entrega, ticket_count: 3, channel_order_count: 23, tickets_per_hundred_orders: 13.0435, avg_hours_to_resolution: "30.00"}
        - {year_month: "2024-01", sales_channel_name: Sem canal, support_category_name: Conta, ticket_count: 1, channel_order_count: null, tickets_per_hundred_orders: null, avg_hours_to_resolution: "8.00"}
  - name: giro_pelo_estoque_medio_do_trimestre
    description: >
      ADR-0052, F2 dos Achados do nl_sql. O par A abre o trimestre com 10
      unidades a custo 2, compradas no trimestre anterior; vende 4 no dia 2;
      compra 10 a custo 5 no dia 3. Fim de dia: 10, 6, 16, 16 → média 12; valor
      20, 12, 56, 56 (custo médio móvel 3,5 desde o dia 3) → média 36; giro
      8 ÷ 36 = 0,22. A compra de 100 a custo 100 no trimestre seguinte não muda
      nada. O par B tem a correção-relâmpago: entra e sai no mesmo dia, a
      posição de fim de dia é zero, e o giro é nulo. O par C começa no dia 2
      (10 a custo 1) e vende 2 no dia 3: os dias contam a partir do primeiro
      movimento, 10, 8, 8 → média 8,67 e giro 0,23 (contando do dia 1 seria
      6,50 e 0,31). O par D começa por uma venda, sem entrada: a posição −2 não
      tem custo, e o valor médio e o giro são nulos. O par E também começa por
      uma venda e só compra no dia 3: os dois primeiros dias não têm custo, e a
      média dos outros dois (8, giro 0,25) passaria por completa; o valor e o
      giro são nulos.
    model: inventory_turnover_by_sku_and_warehouse
    given:
      - input: ref('fact_inventory_movement')
        format: csv
        rows: |
          date_key,product_key,warehouse_key,source_system,quantity_delta,is_inbound,quantity_in,movement_cost_amount,is_sale,quantity_out,cogs_amount
          d0,pa,w1,retail,10,true,10,20,false,0,0
          d2,pa,w1,retail,-4,false,0,8,true,4,8
          d3,pa,w1,retail,10,true,10,50,false,0,0
          d5,pa,w1,retail,100,true,100,10000,false,0,0
          d2,pb,w1,retail,3,true,3,3,false,0,0
          d2,pb,w1,retail,-3,false,0,3,true,3,3
          d2,pc,w1,retail,10,true,10,10,false,0,0
          d3,pc,w1,retail,-2,false,0,2,true,2,2
          d2,pd,w1,retail,-2,false,0,2,true,2,2
          d1,pe,w1,retail,-2,false,0,2,true,2,2
          d3,pe,w1,retail,10,true,10,10,false,0,0
      - input: ref('dim_date')
        rows:
          - {date_key: d0, full_date: "2023-12-31", year_number: 2023, quarter_number: 4}
          - {date_key: d1, full_date: "2024-01-01", year_number: 2024, quarter_number: 1}
          - {date_key: d2, full_date: "2024-01-02", year_number: 2024, quarter_number: 1}
          - {date_key: d3, full_date: "2024-01-03", year_number: 2024, quarter_number: 1}
          - {date_key: d4, full_date: "2024-01-04", year_number: 2024, quarter_number: 1}
          - {date_key: d5, full_date: "2024-04-01", year_number: 2024, quarter_number: 2}
      - input: ref('dim_product')
        rows:
          - {product_key: pa, source_system: retail, product_natural_key: 1, sku: SKU-A, product_name: Produto A, product_category_id: 7}
          - {product_key: pb, source_system: retail, product_natural_key: 2, sku: SKU-B, product_name: Produto B, product_category_id: 7}
          - {product_key: pc, source_system: retail, product_natural_key: 3, sku: SKU-C, product_name: Produto C, product_category_id: 7}
          - {product_key: pd, source_system: retail, product_natural_key: 4, sku: SKU-D, product_name: Produto D, product_category_id: 7}
          - {product_key: pe, source_system: retail, product_natural_key: 5, sku: SKU-E, product_name: Produto E, product_category_id: 7}
      - input: ref('dim_warehouse')
        rows:
          - {warehouse_key: w1, source_system: retail, warehouse_natural_key: 1, warehouse_name: CD Teste, warehouse_region: Sudeste}
      - input: ref('dim_category')
        rows:
          - {source_system: retail, category_natural_key: 7, category_name: Panelas}
    expect:
      rows:
        - {year_quarter: "2024-T1", sku: SKU-A, quantity_out: 4, cost_of_goods_sold: 8, avg_quantity_on_hand: "12.00", avg_inventory_value_amount: "36.00", inventory_turnover: "0.22"}
        - {year_quarter: "2024-T1", sku: SKU-B, quantity_out: 3, cost_of_goods_sold: 3, avg_quantity_on_hand: "0.00", avg_inventory_value_amount: "0.00", inventory_turnover: null}
        - {year_quarter: "2024-T1", sku: SKU-C, quantity_out: 2, cost_of_goods_sold: 2, avg_quantity_on_hand: "8.67", avg_inventory_value_amount: "8.67", inventory_turnover: "0.23"}
        - {year_quarter: "2024-T1", sku: SKU-D, quantity_out: 2, cost_of_goods_sold: 2, avg_quantity_on_hand: "-2.00", avg_inventory_value_amount: null, inventory_turnover: null}
