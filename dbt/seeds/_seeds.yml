version: 2

seeds:
  - name: brazilian_states
    meta:
      domain: transversal
    description: >
      As 27 unidades federativas e a região de cada uma. É dado de referência
      geográfico, não dado gerado: entra por *seed* porque é estável, pequeno e
      precisa estar versionado para que `dim_geography` seja reprodutível.

      As 27 estão aqui, e não só as 14 que os endereços sintéticos usam — uma
      tabela de referência incompleta falha calada no dia em que a geração
      passar a produzir a 15ª.
    config:
      # O BigQuery não tem `varchar(n)`: `string`, e o tamanho fica no teste de valores.
      column_types:
        state_code: "{{ 'varchar(2)' if target.type != 'bigquery' else 'string' }}"
    columns:
      - name: state_code
        description: "Sigla da unidade federativa, com duas letras (SP, RJ…); chave da tabela."
        meta:
          sensitivity: public
        data_tests: [unique, not_null]
      - name: region
        description: "Região do IBGE a que a unidade federativa pertence."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - accepted_values:
              values: [Norte, Nordeste, Centro-Oeste, Sudeste, Sul]
      - name: state_name
        description: "Nome da unidade federativa por extenso."
        meta:
          sensitivity: public

  - name: order_status_transitions
    meta:
      domain: vendas
    description: >
      As transições legais da máquina de estados do pedido — de qual estado para
      qual, e qual delas é a criação. É **regra**, não dado observado: o teste
      `transicao_de_estado_e_declarada` confronta o que aconteceu na origem com
      o que está aqui, e um `pytest` confere que esta lista e os caminhos do
      gerador declaram a mesma máquina.

      Está em *seed* e não em `case` dentro de modelo porque regra escondida em
      SQL é regra que ninguém revisa. Aqui ela cabe numa olhada.
    config:
      column_types:
        from_status: "{{ 'varchar(16)' if target.type != 'bigquery' else 'string' }}"
        to_status: "{{ 'varchar(16)' if target.type != 'bigquery' else 'string' }}"
    columns:
      - name: to_status
        description: "Estado de destino da transição: pending, paid, picking, shipped, delivered, cancelled ou returned."
        meta:
          sensitivity: public
        data_tests:
          - not_null
          - accepted_values:
              values: [pending, paid, picking, shipped, delivered, cancelled, returned]
      - name: from_status
        meta:
          sensitivity: public
        description: Vazio na transição inicial — o pedido não vem de estado nenhum.
        data_tests:
          - accepted_values:
              values: [pending, paid, picking, shipped, delivered, '']
      - name: is_initial
        description: "Verdadeiro na transição que cria o pedido (de nenhum estado para pending)."
        meta:
          sensitivity: public
      - name: description
        description: "O que a transição significa, em português."
        meta:
          sensitivity: public

  - name: support_categories
    meta:
      domain: atendimento
    description: >
      As seis categorias de chamado, com nome legível e agrupamento. É a fonte
      de `dim_support_category`, que é **derivada**: a origem não tem tabela
      para ela — a lista vive no `CHECK` de `support_tickets.category`, e um
      `CHECK` não guarda nome de exibição nem agrupamento.

      Um `pytest` confere que esta lista e o modelo transacional declaram as
      mesmas seis. Se a origem ganhar uma sétima, o teste avisa antes de a
      dimensão perder uma linha em silêncio.
    config:
      column_types:
        category_code: "{{ 'varchar(20)' if target.type != 'bigquery' else 'string' }}"
    columns:
      - name: category_code
        description: "Código estável da categoria de chamado; chave natural."
        meta:
          sensitivity: public
        data_tests:
          - unique
          - not_null
          - accepted_values:
              values: [delivery, payment, product, return, account, other]
      - name: category_name
        description: "Nome da categoria de chamado."
        meta:
          sensitivity: public
        data_tests: [not_null]
      - name: category_group
        description: "Grupo que reúne categorias de chamado afins."
        meta:
          sensitivity: public
        data_tests: [not_null]
      - name: description
        description: "O que a categoria de chamado cobre."
        meta:
          sensitivity: public

  - name: f31_legacy_sale_exceptions
    meta:
      domain: estoque
    description: >
      As saídas por venda do legado sem remessa que nenhuma junção explica, aceitas uma a uma
      pelo Owner (Q72 (d) do plano da reabertura). A injeção de falhas pode destruir o código da
      remessa — a 47 vira `N/A` e é rejeitada —, e o código original só existe no manifesto de
      injeção, que é oráculo de teste e não dado. A guarda `f31_saida_por_venda_tem_remessa`
      reprova toda venda sem remessa que não seja explicada pela quarentena corrente nem esteja
      aqui. Cada linha traz a identidade do movimento e o recorte da captura e do tratamento em
      que foi aceita, e a lista é refeita a cada regeneração. Vazia na `v2.1.0`: as 13 vendas do
      legado sem remessa eram todas explicadas pela quarentena (medido em 18/11/2026).
    config:
      column_types:
        movement_id: "{{ 'text' if target.type != 'bigquery' else 'string' }}"
        source_id: "{{ 'text' if target.type != 'bigquery' else 'string' }}"
        snapshot_id: "{{ 'bigint' if target.type != 'bigquery' else 'int64' }}"
        catalog_version: "{{ 'integer' if target.type != 'bigquery' else 'int64' }}"
        treatment_fingerprint: "{{ 'text' if target.type != 'bigquery' else 'string' }}"
        reason: "{{ 'text' if target.type != 'bigquery' else 'string' }}"
    columns:
      - name: movement_id
        description: "Identificador do movimento de saída por venda do legado aceito como exceção."
        meta:
          sensitivity: internal
        data_tests: [unique, not_null]
      - name: source_id
        description: "Código da remessa que o movimento cita e que não se encontra (o `source_id` do movimento)."
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: snapshot_id
        description: "Captura do legado em que a exceção foi medida e aceita."
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: catalog_version
        description: "Versão do catálogo de falhas do tratamento em que a exceção foi aceita."
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: treatment_fingerprint
        description: "Impressão digital do tratamento em que a exceção foi aceita; outra impressão não a reaproveita."
        meta:
          sensitivity: internal
        data_tests: [not_null]
      - name: reason
        description: "Por que a venda não tem remessa demonstrável, como o Owner a aceitou."
        meta:
          sensitivity: internal
        data_tests: [not_null]
