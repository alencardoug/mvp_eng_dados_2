        meta:
          description_inherited: true
          sensitivity: internal
      - name: handled_ticket_count
        description: "**Não aditiva entre atendentes nem entre versões** — chamados distintos em que o atendente registrou algum evento, na captura que abriu esta versão; fica congelado enquanto a versão vale — a coluna não está em `check_cols`, e uma mudança só dela não a atualiza nem abre versão. O valor atual está em `trusted.support_agents`."
        meta:
          description_reason: o snapshot guarda o acumulado da captura que abriu a versão, não um valor que acompanha o tempo — o herdado diria aditiva (RVL3-03, RVL3-2-04)
