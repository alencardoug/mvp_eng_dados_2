version: 2

# Escrito à mão: só as medidas acumuladas dos snapshots. Um snapshot guarda uma
# linha por **versão** da entidade, e o acumulado é o da captura que abriu a versão,
# congelado — ele não está em `check_cols`. O texto herdado da tabela de trusted
# (uma linha por entidade, valor atual) diria aditiva (RVL3-03, RVL3-2-04, revisão
# do lote 3 da v1.1.0). O resto de cada entrada é derivado por `make catalog`.

snapshots:
  - name: scd_coupon
    description: >
      Histórico dos atributos do cupom, SCD tipo 2 (ADR-0017): uma linha por versão de cada cupom de cada
      origem (`source_system`). Uma versão nova abre quando muda uma das `check_cols` declaradas:
      campanha, tipo e valor do desconto, piso do pedido, atividade e exclusão lógica (ADR-0029). Os
      acumulados de resgate ficam congelados na versão.
    meta:
      domain: marketing
    columns:
      - name: redemption_count
        description: "**Não soma entre versões** — resgates do cupom na captura que abriu esta versão; fica congelado enquanto a versão vale — a coluna não está em `check_cols`, e uma mudança só dela não a atualiza nem abre versão. O valor atual está em `trusted.coupons`."
        meta:
          description_reason: o snapshot guarda o acumulado da captura que abriu a versão, não um valor que acompanha o tempo — o herdado diria aditiva (RVL3-03, RVL3-2-04)
          sensitivity: internal
      - name: redeemed_discount_amount
        description: "**Não soma entre versões** — desconto concedido nos resgates do cupom na captura que abriu esta versão; fica congelado enquanto a versão vale — a coluna não está em `check_cols`, e uma mudança só dela não a atualiza nem abre versão. O valor atual está em `trusted.coupons`."
        meta:
          description_reason: o snapshot guarda o acumulado da captura que abriu a versão, não um valor que acompanha o tempo — o herdado diria aditiva (RVL3-03, RVL3-2-04)
          sensitivity: confidential
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_id
        description: "Identificador do cupom na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_code
        description: "Código digitado pelo cliente."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_id
        description: "Campanha à qual o cupom pertence."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_code
        description: "Código estável da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_name
        description: "Nome da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: campaign_objective
        description: "Objetivo comercial da campanha."
        meta:
          description_inherited: true
          sensitivity: public
      - name: discount_type
        description: "Natureza do desconto: percentage ou fixed."
        meta:
          description_inherited: true
          sensitivity: public
      - name: discount_value
        description: "Valor do desconto: percentual quando `percentage`, moeda quando `fixed`."
        meta:
          description_inherited: true
          sensitivity: confidential
      - name: min_order_amount
        description: "Valor mínimo de pedido para o cupom ser elegível."
        meta:
          description_inherited: true
          sensitivity: public
      - name: max_redemptions
        description: "Limite total de utilizações; nulo quando ilimitado."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: coupon_valid_from
        description: "Início da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: public
      - name: coupon_valid_to
        description: "Fim da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: public
      - name: coupon_is_active
        description: "Indica se o cupom continua aceito."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: first_redeemed_at
        description: "Instante do primeiro resgate do cupom **na captura que abriu esta versão**, congelado: a coluna não está nos `check_cols`, e um resgate novo não abre versão. O valor atual está em `trusted.coupons`."
        meta:
          description_reason: "o valor é o da captura que abriu a versão, congelado fora dos check_cols; o texto herdado de trusted diria o valor atual (RVG-1-03)"
          sensitivity: internal
      - name: last_redeemed_at
        description: "Instante do último resgate do cupom **na captura que abriu esta versão**, congelado pelo mesmo motivo. O valor atual está em `trusted.coupons`."
        meta:
          description_reason: "o valor é o da captura que abriu a versão, congelado fora dos check_cols; o texto herdado de trusted diria o valor atual (RVG-1-03)"
          sensitivity: internal
      - name: is_exhausted
        description: "Verdadeiro quando o cupom tem limite de usos e os resgates já o alcançaram."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: is_redeemable_now
        description: "Verdadeiro quando a data de referência dos dados (`as_of_date`, 01/09/2026) cai dentro da vigência do cupom."
        meta:
          description_inherited: true
          sensitivity: public
      - name: is_deleted
        description: "{{ doc(\"is_deleted\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_created_at
        description: "Momento de criação do registro na origem."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: source_updated_at
        description: "Momento da última alteração; cursor da carga incremental (ADR-0015)."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: dbt_scd_id
        description: "{{ doc(\"dbt_scd_id\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: dbt_updated_at
        description: "{{ doc(\"dbt_updated_at\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: dbt_valid_from
        description: "{{ doc(\"dbt_valid_from\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: dbt_valid_to
        description: "{{ doc(\"dbt_valid_to\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
  - name: scd_customer
    description: >
      Histórico dos atributos do cliente, SCD tipo 2 (ADR-0017): uma linha por versão de cada cliente de
      cada origem (`source_system`, ADR-0039). Uma versão nova abre quando muda segmento, estado do
      relacionamento, cidade, UF ou exclusão lógica. Nome e documento não abrem versão: correção de
      cadastro não é fato novo de negócio.
    meta:
      domain: clientes
    columns:
      - name: order_count
        description: "**Não soma entre versões** — pedidos realizados do cliente na captura que abriu esta versão; fica congelado enquanto a versão vale — a coluna não está em `check_cols`, e uma mudança só dela não a atualiza nem abre versão. O valor atual está em `trusted.customers`."
        meta:
          description_reason: o snapshot guarda o acumulado da captura que abriu a versão, não um valor que acompanha o tempo — o herdado diria aditiva (RVL3-03, RVL3-2-04)
          sensitivity: internal
      - name: lifetime_net_revenue_amount
        description: "**Não soma entre versões** — receita líquida dos itens dos pedidos realizados do cliente na captura que abriu esta versão; fica congelado enquanto a versão vale — a coluna não está em `check_cols`, e uma mudança só dela não a atualiza nem abre versão. O valor atual está em `trusted.customers`."
        meta:
          description_reason: o snapshot guarda o acumulado da captura que abriu a versão, não um valor que acompanha o tempo — o herdado diria aditiva (RVL3-03, RVL3-2-04)
          sensitivity: confidential
      - name: source_system
        description: "{{ doc(\"source_system\") }}"
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_id
        description: "Identificador do cliente na origem, gerado pelo banco transacional."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_code
        description: "Chave natural do cliente na origem; estável entre cargas."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: first_name
        description: "Primeiro nome do cliente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: last_name
        description: "Sobrenome do cliente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: customer_full_name
        description: "Nome completo do cliente: o primeiro nome e o sobrenome, separados por espaço (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: customer_document
        description: "Documento de identificação do cliente (sintético)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: birth_date
        description: "Data de nascimento do cliente (sintética)."
        meta:
          description_inherited: true
          sensitivity: personal
      - name: customer_status
        description: "Estado do relacionamento: active, inactive, blocked ou pending."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: registered_at
        description: "Momento de negócio do cadastro, distinto de `created_at`."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_segment_id
        description: "Segmento comercial ao qual o cliente pertence."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: customer_segment_code
        description: "Código estável do segmento, usado como chave natural."
        meta:
          description_inherited: true
          sensitivity: public
      - name: customer_segment_name
        description: "Nome comercial do segmento."
        meta:
          description_inherited: true
          sensitivity: public
      - name: city
        description: "Cidade; alimenta a dimensão de geografia."
        meta:
          description_inherited: true
          sensitivity: public
      - name: state_code
        description: "Unidade federativa em sigla de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: country
        description: "País em código ISO de duas letras."
        meta:
          description_inherited: true
          sensitivity: public
      - name: first_order_at
        description: "Instante do primeiro pedido realizado do cliente; nulo para quem nunca comprou. Conta o pedido cujos itens foram todos rejeitados e estão na quarentena, que não chega a `fact_sales_order_item`: a primeira compra pode não estar na fato."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: last_order_at
        description: "Instante do último pedido realizado do cliente; nulo para quem nunca comprou."
        meta:
          description_inherited: true
          sensitivity: internal
      - name: second_order_at
        description: "Instante do segundo pedido realizado do cliente **na captura que abriu esta versão**, congelado fora dos `check_cols`. O valor atual está em `trusted.customers`."
        meta:
          description_reason: "o valor é o da captura que abriu a versão, congelado fora dos check_cols; o texto herdado de trusted diria o valor atual (RVG-1-03)"
          sensitivity: internal
      - name: is_active
        description: "Se o cliente era ativo **na captura que abriu esta versão**, congelado fora dos `check_cols`. O valor atual está em `trusted.customers`."
        meta:
          description_reason: "o valor é o da captura que abriu a versão, congelado fora dos check_cols; o texto herdado de trusted diria o valor atual (RVG-1-03)"
          sensitivity: internal
      - name: is_repeat_buyer
        description: "Se o cliente era recorrente **na captura que abriu esta versão**, congelado fora dos `check_cols`. O valor atual está em `trusted.customers`."
        meta:
          description_reason: "o valor é o da captura que abriu a versão, congelado fora dos check_cols; o texto herdado de trusted diria o valor atual (RVG-1-03)"
          sensitivity: internal
      - name: is_churned
